name: Opdatér aktiekurser

# Henter kurser for hele universet (S&P 500, Nasdaq-100 og Nasdaq København)
# og committer dem som JSON. Kører server-side, så der er hverken
# CORS-begrænsning eller API-nøgle involveret.
#
# To slags kørsler, fordi historikken fylder ~8 MB og kun ændrer sig én gang
# i døgnet, mens kurserne ændrer sig løbende:
#   • i løbet af dagen  → kun data/aktier.json (én fil på ~600 KB)
#   • efter lukketid    → også universet og alle historikfiler
#
# Bemærk: planlagte kørsler sker kun på default-branchen. På andre brancher
# kan workflowet startes manuelt under fanen Actions.

on:
  schedule:
    # Hverdage. Kort efter åbning og midt på dagen henter vi kun kurser;
    # kørslen kl. 16:30 UTC er efter lukketid i København uanset sommertid
    # og opdaterer også historik og indekssammensætning.
    - cron: '30 7,11 * * 1-5'
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      full:
        description: 'Opdatér også univers og historik'
        type: boolean
        default: true

concurrency:
  group: update-stocks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # A full run fetches three endpoints for every company in the universe and
    # takes a few minutes; the default 6-hour limit is generous, but a hung
    # request should not hold a runner all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Kun aftenkørslen og et manuelt "full" rører historikken.
      - name: Afgør kørselstype
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL="${{ inputs.full }}"
          elif [ "${{ github.event.schedule }}" = "30 16 * * 1-5" ]; then
            FULL=true
          else
            FULL=false
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Fuld kørsel: $FULL"

      - name: Hent kurser
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            node scripts/fetch-stocks.mjs
          else
            node scripts/fetch-stocks.mjs --quotes-only --no-history
          fi

      # Fondene hentes for sig. En fejl her må ikke koste dagens aktiekurser,
      # som allerede står på disken — derfor "continue-on-error".
      - name: Hent ETF'er
        continue-on-error: true
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            node scripts/fetch-etf.mjs --history
          else
            node scripts/fetch-etf.mjs --quotes-only
          fi

      # De danske investeringsbeviser har deres eget kald hos udstederen: alt
      # det Yahoo ikke har for en investeringsforening — fordeling, brancher,
      # lande, omkostninger og indre værdi. Kun aftenkørslen, fordi tallene
      # opgøres månedligt, ikke i løbet af dagen.
      - name: Hent investeringsbeviser
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: node scripts/fetch-beviser.mjs

      # Headerens søgning læser én lille fil frem for de to store lister.
      # Den bygges af dem, så den skal laves efter begge — også på de korte
      # kørsler, hvor kun kurserne er hentet.
      - name: Byg søgeindeks
        continue-on-error: true
        run: node scripts/build-soegeindeks.mjs

      # Arkivet er frosset ved sidste årsskifte, så det her er en no-op for alt
      # der allerede er hentet. Det henter kun nye noteringer — og én gang om
      # året, når årstallet skifter, hele bunken igen.
      - name: Arkivér ny historik
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: node scripts/fetch-arkiv.mjs

      - name: Commit hvis der er ændringer
        run: |
          if git diff --quiet -- data/; then
            echo "Ingen kursændringer — intet at committe."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Opdatér aktiekurser ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # En kørsel tager minutter, og et push til main imens gør pushet her
          # til et non-fast-forward. Kørslen har kun rørt data/, så en rebase
          # oven på det nye main er sikker — og billigere end at smide ti
          # minutters hentning væk.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push afvist — henter main og prøver igen ($attempt/3)"
            git pull --rebase origin main || exit 1
          done
          git push
