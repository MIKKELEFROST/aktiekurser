<!DOCTYPE html>
<html lang="da" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktie – detaljer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/kursliste.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
</script>
<style>
  .chart-wrap { position: relative; }
  .crosshair { pointer-events: none; }
  #tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.10); z-index: 5;
  }
  .stat { border-top: 1px solid var(--gridline); }
  .range-btn {
    border: 1px solid var(--hairline); color: var(--text-secondary);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700;
  }
  .range-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .date-input {
    border: 1px solid var(--hairline); border-radius: 8px; padding: 5px 8px;
    font-size: 12px; background: transparent; color: var(--text-primary);
  }

  /* Series colours for the comparison chart. Four hues that hold apart from
     each other and from the red accent, defined for both themes. */
  :root { --s1: #1f6feb; --s2: #0f766e; --s3: #7c3aed; --s4: #a16207; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --s1: #6ea8fe; --s2: #2dd4bf; --s3: #c4b5fd; --s4: #fbbf24; }
  }
  :root[data-theme="dark"] { --s1: #6ea8fe; --s2: #2dd4bf; --s3: #c4b5fd; --s4: #fbbf24; }

  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: baseline; }
  .cmp { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-secondary); }
  .cmp input { accent-color: var(--accent); }
  .cmp input:checked + span { color: var(--text-primary); font-weight: 600; }

  /* Overview strip: the headline figures on one line under the company name. */
  .overview {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    padding: 12px 14px; border-radius: 12px;
    background: var(--surface-1); border: 1px solid var(--hairline);
  }
  .ov { display: inline-flex; align-items: baseline; gap: 5px; font-size: 13px; }
  .ov-k { color: var(--text-muted); }
  .ov-v { font-weight: 700; color: var(--text-primary); }
  .ov-sep { color: var(--text-muted); opacity: .55; }
  .overview p { flex-basis: 100%; margin: 0; }
  .ov-row {
    display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 8px 16px; width: 100%;
  }
  .ov-figures { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .adv-toggle {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
    font-size: 12px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
    white-space: nowrap;
  }
  .adv-toggle input { accent-color: var(--accent); cursor: pointer; }
  .adv-toggle:hover span { color: var(--text-primary); }

  /* ── Nøgletal ─────────────────────────────────────────────────────────
     Value first, label under it, two to a row: the figure is what the eye
     is looking for, and the label is what it reads once it has found it. */
  .kf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; }
  @media (min-width: 900px) { .kf-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .kf-v { font-size: 17px; font-weight: 800; color: var(--text-primary); }
  .kf-k { font-size: 12px; color: var(--text-muted); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .kf-more { font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0;
             cursor: pointer; padding: 6px 0; display: inline-flex; align-items: center; gap: 6px; }

  /* ── Om ───────────────────────────────────────────────────────────────
     Four lines, then the rest on request. The source writes a paragraph
     that runs to a screenful for the larger companies. */
  .about-text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
  .about-text.clamped {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── Analytikerskøn ───────────────────────────────────────────────────
     One hue; the bar carries the count and the number is always printed
     beside it, so the bar never has to be read on colour alone. */
  .an-row { display: grid; grid-template-columns: 7.5rem 1fr 3rem; align-items: center; gap: 12px; padding: 4px 0; }
  .an-label { font-size: 13px; color: var(--text-secondary); }
  /* Both are spans inside a grid cell, so they need to be told to be boxes —
     an inline element ignores height, and the bar had none. */
  .an-track { display: block; height: 10px; border-radius: 5px; background: var(--gridline); overflow: hidden; }
  .an-bar { display: block; height: 100%; border-radius: 5px; background: var(--text-primary); }
  .an-pct { font-size: 13px; font-weight: 700; text-align: right; color: var(--text-primary); }

  /* ── Forventet kurs ───────────────────────────────────────────────────
     Two marks on one line, each labelled with its own number, and the
     analysts' lowest and highest drawn as the ends — a single mean on its
     own would read as a promise. */
  /* One caption above the line and one below, so the two never collide when
     the target sits close to the price. */
  .tg-wrap { padding: 46px 0 8px; }
  .tg-line { position: relative; height: 2px; background: var(--gridline); border-radius: 2px; }
  .tg-mark { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
             transform: translate(-50%, -50%); }
  .tg-cap { position: absolute; transform: translateX(-50%); white-space: nowrap;
            font-size: 11px; text-align: center; color: var(--text-muted); }
  .tg-cap-up   { bottom: 16px; }
  .tg-cap-down { top: 16px; }
  .tg-cap strong { display: block; font-size: 13px; color: var(--text-primary); }
  /* Clears the caption that hangs below the line, which sits in the same
     space and was landing on top of "Lavest". */
  .tg-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 62px; }

</style>
</head>

<body class="font-sans antialiased">
<header id="sitenav"></header>

<div class="max-w-[1100px] mx-auto px-4 py-8">
  <div id="content"></div>
  <p id="status" class="text-xs mt-6 muted" role="status" aria-live="polite"></p>
</div>

<script src="assets/kursliste.js"></script>
<script>
(() => {
  'use strict';
  const K = window.KL;
  const $ = (s) => document.querySelector(s);
  K.renderNav('kurser');

  let TOTAL = 0;
  // Filled once the extra files land; every section that reads them checks
  // first, so the page renders with whatever arrived.
  let ALL = [], KEYS = null, FUND = null, BENCH = null;

  const params = new URLSearchParams(location.search);
  const wanted = (params.get('symbol') || '').toUpperCase();

  // ── Chart geometry, shared by draw and hover ───────────────────────────
  const G = { W: 900, H: 280, L: 60, R: 14, T: 16, B: 30 };
  G.iw = G.W - G.L - G.R;
  G.ih = G.H - G.T - G.B;

  const chart = { dates: [], closes: [], currency: '' };

  // Presets are counted in trading sessions rather than calendar days, so a
  // window always holds the number of points it claims regardless of holidays.
  const PRESETS = [
    // The short windows are counted so the move they report matches the
    // list's columns: a trading week is five sessions, not seven days.
    { key: '1d',  label: '1d',    sessions: 2 },
    { key: '1u',  label: '1 uge',  sessions: 6 },
    { key: '1m',  label: '1 md.',  sessions: 21 },
    { key: '3m',  label: '3 mdr.', sessions: 63 },
    { key: '6m',  label: '6 mdr.', sessions: 126 },
    { key: 'ytd', label: 'I år',   ytd: true },
    { key: '1y',  label: '1 år',   sessions: 252 },
    { key: '3y',  label: '3 år',   sessions: 756 },
    { key: 'all', label: 'Alt',    sessions: Infinity },
  ];

  // Simple by default. Most people arrive asking how a share is doing, not to
  // value the company; the rest of the page is one tick away and the choice is
  // remembered, so a reader who wants it never has to ask twice.
  const ADV_STORE = 'kursliste.avanceret.v1';
  const advOn = () => { try { return localStorage.getItem(ADV_STORE) === '1'; } catch (e) { return false; } };
  const setAdv = (on) => { try { localStorage.setItem(ADV_STORE, on ? '1' : '0'); } catch (e) { /* privat vindue */ } };

  const state = { range: '3m', from: '', to: '', compare: [], adv: advOn() };

  function slice(full) {
    const { dates, closes } = full;
    if (state.range === 'custom' && (state.from || state.to)) {
      const out = { dates: [], closes: [] };
      for (let i = 0; i < dates.length; i++) {
        if (state.from && dates[i] < state.from) continue;
        if (state.to && dates[i] > state.to) continue;
        out.dates.push(dates[i]); out.closes.push(closes[i]);
      }
      return out;
    }
    // Fall back by key, not by position: the array grows at the front.
    const p = PRESETS.find((x) => x.key === state.range) || PRESETS.find((x) => x.key === '3m');

    // Year to date is measured off the previous year's final close, the way a
    // YTD return is normally quoted — starting at the first session in January
    // instead would silently drop that first day's move. The window therefore
    // opens on a December date, which the summary states plainly.
    if (p.ytd) {
      const jan1 = new Date().getFullYear() + '-01-01';
      let i = dates.findIndex((d) => d >= jan1);
      if (i === -1) i = dates.length - 1;      // nothing this year yet
      if (i > 0) i -= 1;                       // include the previous close as the base
      return { dates: dates.slice(i), closes: closes.slice(i) };
    }

    const n = Math.min(dates.length, p.sessions === Infinity ? dates.length : p.sessions);
    return { dates: dates.slice(-n), closes: closes.slice(-n) };
  }

  // ── Comparison chart ───────────────────────────────────────────────────
  // A stock and an index cannot share a price axis — one trades at 168, the
  // other at 29.544. Both are therefore rebased to 0% at the start of the
  // window, which puts them on one scale that means the same thing for each:
  // what a krone invested that day would have done since.
  const SERIES_COLOURS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

  // The index is quoted on its own trading calendar. For each of the stock's
  // days, take the index's last close on or before it, so a Danish holiday
  // cannot shift the two series against each other.
  function alignTo(dates, series) {
    const out = [];
    let j = 0;
    for (const d of dates) {
      while (j + 1 < series.dates.length && series.dates[j + 1] <= d) j++;
      out.push(series.dates[j] <= d ? series.closes[j] : null);
    }
    return out;
  }

  const rebase = (values) => {
    const base = values.find((v) => v != null);
    return base ? values.map((v) => (v == null ? null : ((v - base) / base) * 100)) : values.map(() => null);
  };

  function drawCompareChart(dates, closes, r) {
    const own = rebase(closes);
    const lines = [{ label: r.symbol, colour: 'var(--accent)', values: own }];
    state.compare.forEach((code, i) => {
      const b = BENCH && BENCH[code];
      if (!b) return;
      lines.push({ label: b.label, colour: SERIES_COLOURS[i % SERIES_COLOURS.length],
        values: rebase(alignTo(dates, b)) });
    });

    const all = lines.flatMap((l) => l.values).filter((v) => v != null);
    if (all.length < 2) return '<p class="text-sm muted py-10 text-center">Ikke nok data til sammenligningen.</p>';
    const min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    const pad = (max - min) * 0.1 || 1;
    const lo = min - pad, hi = max + pad;
    const x = (i) => G.L + (G.iw * i) / Math.max(1, dates.length - 1);
    const y = (v) => G.T + G.ih * (1 - (v - lo) / (hi - lo));

    const gridVals = Array.from({ length: 4 }, (_, k) => lo + ((hi - lo) * k) / 3);
    const grid = gridVals.map((v) =>
      '<line x1="' + G.L + '" y1="' + y(v).toFixed(1) + '" x2="' + (G.W - G.R) + '" y2="' + y(v).toFixed(1) + '" '
      + 'stroke="var(--gridline)" stroke-width="1"/>'
      + '<text x="' + (G.L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" '
      + 'font-size="11" fill="var(--text-muted)">' + K.fmtPct(v) + '</text>').join('');

    // A dashed rule at zero: the level every series starts from.
    const zero = (lo < 0 && hi > 0)
      ? '<line x1="' + G.L + '" y1="' + y(0).toFixed(1) + '" x2="' + (G.W - G.R) + '" y2="' + y(0).toFixed(1)
        + '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>' : '';

    const idx = [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
    const xLabels = idx.map((i, n) =>
      '<text x="' + x(i).toFixed(1) + '" y="' + (G.H - 9) + '" text-anchor="'
      + (n === 0 ? 'start' : n === 2 ? 'end' : 'middle') + '" font-size="11" fill="var(--text-muted)">'
      + new Date(dates[i]).toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: '2-digit' })
      + '</text>').join('');

    const paths = lines.map((l) => {
      let d = '', pen = false;
      l.values.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? ' L' : ' M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1);
        pen = true;
      });
      return '<path d="' + d.trim() + '" fill="none" stroke="' + l.colour + '" stroke-width="2" '
        + 'stroke-linecap="round" stroke-linejoin="round"/>';
    }).join('');

    // Each series is named where it ends as well as in the legend, so identity
    // never rests on colour alone.
    const ends = lines.map((l) => {
      const last = l.values.reduce((a, v, i) => (v == null ? a : i), -1);
      if (last < 0) return '';
      return '<text x="' + (G.W - G.R) + '" y="' + (y(l.values[last]) - 6).toFixed(1) + '" text-anchor="end" '
        + 'font-size="11" font-weight="700" fill="' + l.colour + '">' + K.esc(l.label) + ' '
        + K.fmtPct(l.values[last]) + '</text>';
    }).join('');

    return '<div class="chart-wrap">'
      + '<svg viewBox="0 0 ' + G.W + ' ' + G.H + '" width="100%" height="' + G.H + '" role="img" '
      + 'aria-label="Udvikling i procent for ' + K.esc(lines.map((l) => l.label).join(', ')) + '" style="display:block">'
      + grid + zero + xLabels + paths + ends
      + '</svg></div>'
      + '<div class="flex flex-wrap gap-3 mt-2 text-xs" style="display:flex;flex-wrap:wrap;gap:12px">'
      + lines.map((l) => '<span><span class="swatch" style="background:' + l.colour + '"></span> '
          + K.esc(l.label) + '</span>').join('')
      + '</div>';
  }

  function drawChart(dates, closes, currency) {
    if (closes.length < 2) {
      return '<p class="text-sm muted py-10 text-center">Perioden indeholder for få handelsdage til en graf.</p>';
    }
    chart.dates = dates; chart.closes = closes; chart.currency = currency;

    const min = Math.min.apply(null, closes), max = Math.max.apply(null, closes);
    const pad = (max - min) * 0.08 || 1;
    const lo = min - pad, hi = max + pad;
    const x = (i) => G.L + (G.iw * i) / (closes.length - 1);
    const y = (v) => G.T + G.ih * (1 - (v - lo) / (hi - lo));

    // Four gridlines read a level without competing with the line itself.
    const grid = Array.from({ length: 4 }, (_, k) => lo + ((hi - lo) * k) / 3).map((v) =>
      '<line x1="' + G.L + '" y1="' + y(v).toFixed(1) + '" x2="' + (G.W - G.R) + '" y2="' + y(v).toFixed(1) + '" '
      + 'stroke="var(--gridline)" stroke-width="1"/>'
      + '<text x="' + (G.L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" '
      + 'font-size="11" fill="var(--text-muted)">' + K.fmtPrice(v) + '</text>').join('');

    // Three date ticks; one per session would collide at any width.
    const idx = [0, Math.floor((dates.length - 1) / 2), dates.length - 1];
    const xLabels = idx.map((i, n) =>
      '<text x="' + x(i).toFixed(1) + '" y="' + (G.H - 9) + '" text-anchor="'
      + (n === 0 ? 'start' : n === 2 ? 'end' : 'middle') + '" font-size="11" fill="var(--text-muted)">'
      + new Date(dates[i]).toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: '2-digit' })
      + '</text>').join('');

    const d = closes.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const stroke = closes[closes.length - 1] >= closes[0] ? 'var(--delta-up)' : 'var(--delta-down)';
    chart.lo = lo; chart.hi = hi;

    return '<div class="chart-wrap">'
      + '<svg id="chart" viewBox="0 0 ' + G.W + ' ' + G.H + '" width="100%" height="' + G.H + '" '
      + 'role="img" aria-label="Kursudvikling ' + K.esc(dates[0]) + ' til ' + K.esc(dates[dates.length - 1])
      + ', fra ' + K.fmtPrice(closes[0]) + ' til ' + K.fmtPrice(closes[closes.length - 1]) + ' ' + K.esc(currency)
      + '" style="display:block">'
      + grid + xLabels
      + '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round"/>'
      + '<rect id="selband" x="0" y="' + G.T + '" width="0" height="' + G.ih + '" '
        + 'fill="var(--accent)" opacity="0.10" pointer-events="none"/>'
      + '<line id="selstart" y1="' + G.T + '" y2="' + (G.T + G.ih) + '" stroke="var(--accent)" '
        + 'stroke-width="1.5" opacity="0" pointer-events="none"/>'
      + '<g class="crosshair" opacity="0">'
      + '<line id="chx" y1="' + G.T + '" y2="' + (G.T + G.ih) + '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<circle id="chd" r="4.5" fill="' + stroke + '" stroke="var(--surface-1)" stroke-width="2"/></g>'
      + '<rect id="hit" x="' + G.L + '" y="' + G.T + '" width="' + G.iw + '" height="' + G.ih + '" fill="transparent"/>'
      + '</svg><div id="tooltip"></div></div>';
  }

  // Selection: click once to set the start, once more to set the end. A drag
  // does the same thing in one gesture. Either way the summary underneath
  // reports the move across exactly the days picked.
  const sel = { a: null, b: null, dragging: false };

  function wireChart() {
    const svg = $('#chart'); if (!svg) return;
    const hit = $('#hit'), tip = $('#tooltip');
    const wrap = svg.parentElement;
    const cross = svg.querySelector('.crosshair'), line = $('#chx'), dot = $('#chd');
    const band = $('#selband'), startLine = $('#selstart');

    // The viewBox is letterboxed inside the element whenever their aspect
    // ratios differ, so mapping the element's own width onto viewBox units
    // drifts at the edges. getScreenCTM carries the real scale and offset.
    const toViewBox = (cx, cy) => {
      const m = svg.getScreenCTM();
      return m ? new DOMPoint(cx, cy).matrixTransform(m.inverse()) : null;
    };
    const toClient = (x, y) => {
      const m = svg.getScreenCTM();
      return m ? new DOMPoint(x, y).matrixTransform(m) : null;
    };
    const xOf = (i) => G.L + (G.iw * i) / (chart.closes.length - 1);
    const indexAt = (clientX) => {
      const vb = toViewBox(clientX, 0);
      if (!vb) return null;
      const t = Math.min(1, Math.max(0, (vb.x - G.L) / G.iw));
      return Math.round(t * (chart.closes.length - 1));
    };

    function paintSelection() {
      if (sel.a == null) { band.setAttribute('width', 0); startLine.setAttribute('opacity', 0); return; }
      const xa = xOf(sel.a);
      startLine.setAttribute('x1', xa); startLine.setAttribute('x2', xa);
      startLine.setAttribute('opacity', 1);
      if (sel.b == null) { band.setAttribute('width', 0); return; }
      const xb = xOf(sel.b);
      band.setAttribute('x', Math.min(xa, xb));
      band.setAttribute('width', Math.abs(xb - xa));
    }

    function summarise() {
      if (sel.a == null || sel.b == null) return;
      const lo = Math.min(sel.a, sel.b), hi = Math.max(sel.a, sel.b);
      if (hi === lo) return;
      const from = chart.closes[lo], to = chart.closes[hi];
      const pct = from ? ((to - from) / from) * 100 : null;
      const dates = chart.dates.slice(lo, hi + 1), closes = chart.closes.slice(lo, hi + 1);
      $('#selSummary').innerHTML = '<span class="font-bold" style="color:var(--text-primary)">Valgt periode:</span> '
        + K.fmtDate(chart.dates[lo]) + ' → ' + K.fmtDate(chart.dates[hi])
        + ' · ' + (hi - lo + 1) + ' handelsdage · '
        + K.fmtPrice(from) + ' → ' + K.fmtPrice(to) + ' ' + K.esc(chart.currency)
        + ' · <span class="num font-bold ' + K.dirClass(pct) + '">' + K.fmtPct(pct) + '</span>'
        + ' <button id="selClear" class="range-btn" style="padding:2px 9px;margin-left:6px">Ryd</button>'
        + '<br>' + peakLine(dates, closes, chart.currency, 'Højeste i markeringen');
      $('#selSummary').hidden = false;
      $('#selClear').addEventListener('click', () => {
        sel.a = sel.b = null; paintSelection(); $('#selSummary').hidden = true;
      });
    }

    hit.addEventListener('mousemove', (evt) => {
      if (!chart.closes.length) return;
      const i = indexAt(evt.clientX);
      if (i == null) return;

      const cx = xOf(i);
      const cy = G.T + G.ih * (1 - (chart.closes[i] - chart.lo) / (chart.hi - chart.lo));
      cross.setAttribute('opacity', '1');
      line.setAttribute('x1', cx); line.setAttribute('x2', cx);
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);

      tip.style.opacity = '1';
      let body = '<strong class="num">' + K.fmtPrice(chart.closes[i]) + ' ' + K.esc(chart.currency) + '</strong>'
        + '<br><span class="faint">' + K.fmtDate(chart.dates[i]) + '</span>';
      // While a start is set, the tooltip previews the move to the cursor.
      if (sel.a != null && sel.b == null && i !== sel.a) {
        const from = chart.closes[sel.a];
        const pct = from ? ((chart.closes[i] - from) / from) * 100 : null;
        body += '<br><span class="num font-bold ' + K.dirClass(pct) + '">' + K.fmtPct(pct) + '</span>'
          + '<span class="faint"> fra ' + K.fmtDate(chart.dates[sel.a]) + '</span>';
      }
      tip.innerHTML = body;

      if (sel.dragging) { sel.b = i; paintSelection(); }

      const pt = toClient(cx, cy);
      if (!pt) return;
      const box = wrap.getBoundingClientRect();
      const lx = pt.x - box.left, ly = pt.y - box.top;
      const flip = lx + tip.offsetWidth + 16 > box.width;
      tip.style.left = Math.max(0, flip ? lx - tip.offsetWidth - 12 : lx + 12) + 'px';
      tip.style.top = Math.max(0, ly - 10) + 'px';
    });

    hit.addEventListener('mousedown', (evt) => {
      const i = indexAt(evt.clientX);
      if (i == null) return;
      evt.preventDefault();
      // A fresh start whenever both ends are already set.
      if (sel.a != null && sel.b != null) { sel.a = i; sel.b = null; }
      else if (sel.a == null) sel.a = i;
      sel.dragging = true;
      paintSelection();
    });

    hit.addEventListener('mouseup', (evt) => {
      const i = indexAt(evt.clientX);
      sel.dragging = false;
      if (i == null) return;
      // A press and release on the same day is a click: keep waiting for the
      // second one. Anywhere else closes the selection.
      if (i === sel.a && sel.b == null) { paintSelection(); return; }
      sel.b = i;
      paintSelection();
      summarise();
    });

    hit.addEventListener('mouseleave', () => {
      sel.dragging = false;
      cross.setAttribute('opacity', '0');
      tip.style.opacity = '0';
    });

    paintSelection();
    if (sel.a != null && sel.b != null) summarise();
  }

  // ── Stat rows ──────────────────────────────────────────────────────────
  function statRow(label, value, cls, hint) {
    const lab = hint
      ? '<span class="hint" tabindex="0" data-hint-title="' + K.esc(label) + '" data-hint="' + K.esc(hint) + '">' + label + '</span>'
      : label;
    return '<div class="stat py-2.5 flex items-baseline justify-between gap-4">'
      + '<span class="text-xs muted">' + lab + '</span>'
      + '<span class="text-sm num font-semibold ' + (cls || '') + '">' + value + '</span></div>';
  }

  // The change across a period only compares its two ends, which hides how far
  // the price ran and fell back inside it. The peak within the window, and the
  // distance from it, is what says whether a fall is still in progress.
  function peakOf(dates, closes) {
    if (!closes || closes.length < 2) return null;
    let mi = 0;
    for (let i = 1; i < closes.length; i++) if (closes[i] > closes[mi]) mi = i;
    const peak = closes[mi], last = closes[closes.length - 1];
    return {
      value: peak,
      date: dates[mi],
      pct: peak ? ((last - peak) / peak) * 100 : null,
      atPeak: mi === closes.length - 1,
    };
  }

  function peakLine(dates, closes, currency, label) {
    const pk = peakOf(dates, closes);
    if (!pk) return '';
    return '<span class="hint" tabindex="0" data-hint-title="Toppen i perioden" '
      + 'data-hint="Den højeste lukkekurs inden for netop den viste periode, og hvor langt kursen ligger under den i dag. '
      + 'Det er noget andet end all-time high, som gælder hele selskabets historie.">'
      + label + '</span> <span class="num font-semibold">' + K.fmtPrice(pk.value) + ' ' + K.esc(currency) + '</span>'
      + ' <span class="faint">den ' + K.fmtDate(pk.date) + '</span>'
      + (pk.atPeak
          ? ' · <span class="up font-bold">kursen står i periodens top</span>'
          : ' · <span class="num font-bold ' + K.dirClass(pk.pct) + '">' + K.fmtPct(pk.pct) + '</span>'
            + ' <span class="faint">fra det niveau</span>');
  }

  // ── Did-you-know facts ─────────────────────────────────────────────────
  // Every figure here is derived from the price history in the data file, not
  // fetched from anywhere, so each card says what it is measured over.
  function facts(r) {
    const st = r.stats || {};
    const out = [];
    const card = (label, value, cls, note) => out.push({ label, value, cls: cls || '', note: note || '' });

    if (r.drawdown_pct != null) {
      const flat = Math.abs(r.drawdown_pct) < 0.05;
      card('Fra toppen nogensinde',
        flat ? 'På toppen' : K.fmtPct(r.drawdown_pct),
        flat ? 'up' : K.dirClass(r.drawdown_pct),
        flat ? 'Kursen står i sit højeste niveau nogensinde.'
             : 'Højeste kurs var ' + K.fmtPrice(r.ath) + ' ' + K.esc(r.currency) + ' den ' + K.fmtDate(r.ath_date) + '.');
    }
    if (r.first_trade_date) {
      const years = Math.floor((Date.now() - new Date(r.first_trade_date)) / 31557600000);
      card('År på børsen', years, '', 'Første registrerede kurs ' + K.fmtDate(r.first_trade_date) + '.');
    }
    if (st.best_day) {
      card('Bedste enkeltdag', K.fmtPct(st.best_day.pct), 'up', 'Den ' + K.fmtDate(st.best_day.date) + ', inden for det seneste år.');
    }
    if (st.worst_day) {
      card('Værste enkeltdag', K.fmtPct(st.worst_day.pct), 'down', 'Den ' + K.fmtDate(st.worst_day.date) + ', inden for det seneste år.');
    }
    if (st.up_days != null && st.trading_days) {
      const pct = Math.round((st.up_days / st.trading_days) * 100);
      card('Dage i plus', pct + '%', '', st.up_days + ' ud af ' + st.trading_days + ' handelsdage sluttede højere end dagen før.');
    }
    if (st.volatility != null) {
      card('Volatilitet', st.volatility + '%', '',
        'Hvor meget kursen typisk svinger på et år. Under 20% regnes som roligt, over 40% som uroligt.');
    }
    if (st.streak && st.streak.days > 1) {
      card('Aktuel stime', st.streak.days + ' dage', st.streak.dir > 0 ? 'up' : 'down',
        'Kursen er gået ' + (st.streak.dir > 0 ? 'op' : 'ned') + ' ' + st.streak.days + ' handelsdage i træk.');
    }
    if (st.longest_up || st.longest_down) {
      card('Længste stime', st.longest_up + ' op / ' + st.longest_down + ' ned', '',
        'De længste ubrudte serier af op- og nedture det seneste år.');
    }
    if (st.ma50 != null && st.ma200 != null && r.price != null) {
      const over50 = r.price >= st.ma50, over200 = r.price >= st.ma200;
      card('Mod gennemsnittet',
        (over50 ? 'Over' : 'Under') + ' 50 · ' + (over200 ? 'over' : 'under') + ' 200',
        over50 && over200 ? 'up' : (!over50 && !over200) ? 'down' : '',
        '50-dages gennemsnit ' + K.fmtPrice(st.ma50) + ', 200-dages ' + K.fmtPrice(st.ma200)
          + '. Mange bruger de to linjer til at aflæse trenden.');
    }
    if (st.max_volume) {
      card('Travleste dag', K.fmtBig(st.max_volume.volume), '',
        K.fmtBig(st.max_volume.volume) + ' aktier skiftede hænder den ' + K.fmtDate(st.max_volume.date) + '.');
    }
    if (r.rank_all) {
      card('Plads på listen', '#' + r.rank_all, '',
        'Blandt alle ' + K.fmtInt(TOTAL) + ' selskaber, målt på markedsværdi omregnet til kroner.');
    }
    return out;
  }

  // ── Key figures from the statements ────────────────────────────────────
  const keyOf = (symbol) => (KEYS && KEYS.stocks ? KEYS.stocks[symbol] || null : null);
  const pct1 = (v) => (v == null ? null : (v > 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + '%');
  const mult = (v) => (v == null ? null : v.toFixed(1).replace('.', ',') + 'x');

  function daysUntil(iso) {
    if (!iso) return null;
    const d = Math.round((new Date(iso + 'T12:00:00Z') - Date.now()) / 86400000);
    return Number.isFinite(d) ? d : null;
  }

  // One line of the figures a reader would otherwise open four pages to find.
  // Anything missing is dropped rather than printed as a dash, so the line
  // stays short for the companies we know least about.
  function overviewStrip(r) {
    const k = keyOf(r.symbol);
    const bits = [];
    const add = (label, value, hint) => {
      if (value == null) return;
      bits.push('<span class="ov"><span class="ov-k hint" tabindex="0" data-hint-title="' + K.esc(label)
        + '" data-hint="' + K.esc(hint) + '">' + K.esc(label) + '</span> <span class="ov-v num">' + value + '</span></span>');
    };

    if (r.market_cap != null) {
      add('Markedsværdi', K.fmtBig(r.market_cap) + ' ' + K.esc(r.currency),
        'Kursen gange antallet af aktier, i selskabets egen valuta.');
    }
    // The four ratios are what separates the two views, so they sit beside the
    // switch that reveals them.
    if (k && state.adv) {
      add('P/E', mult(K.peOf(r.price, k.eps_ttm)),
        'Kursen delt med indtjeningen pr. aktie de seneste fire kvartaler. Hvor mange års indtjening du betaler for én aktie. Beregnet af den kurs der står her på siden.');
      add('Forward P/E', mult(K.peOf(r.price, k.eps_fwd)),
        'Samme regnestykke, men med analytikernes forventede indtjening for det kommende år i stedet. Lavere end P/E betyder at indtjeningen ventes at vokse.');
      add('Omsætningsvækst', pct1(k.revenue_growth),
        'Væksten i omsætning i forhold til samme kvartal året før.');
      add('FCF-margin', k.fcf_margin == null ? null : (k.fcf_margin * 100).toFixed(1).replace('.', ',') + '%',
        'Frit cash flow som andel af omsætningen — hvor stor en del af hver krone i salg der bliver til kontanter selskabet frit kan bruge.');
    }
    const days = k ? daysUntil(k.next_earnings) : null;
    const cal = (days != null && days >= 0)
      ? '<p class="text-sm mt-2 muted">Næste regnskab: <strong style="color:var(--text-primary)">'
        + K.fmtDate(k.next_earnings) + '</strong> <span class="faint">· '
        + (days === 0 ? 'i dag' : days === 1 ? 'om 1 dag' : 'om ' + days + ' dage') + '</span></p>'
      : '';

    const toggle = '<label class="adv-toggle">'
      + '<input type="checkbox" id="advToggle"' + (state.adv ? ' checked' : '') + '>'
      + '<span>Avanceret visning</span></label>';

    return '<div class="overview mb-5">'
      + '<div class="ov-row">'
        + '<div class="ov-figures">' + bits.join('<span class="ov-sep" aria-hidden="true">·</span>') + '</div>'
        + toggle
      + '</div>' + cal + '</div>';
  }

  // ── Om ─────────────────────────────────────────────────────────────────
  // The source writes this in English and we print it in English rather than
  // machine-translating four and a half thousand company descriptions into
  // something nobody has read.
  function aboutBlock(r) {
    const text = FUND && FUND.summary;
    if (!text) return '';
    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-2">Om ' + K.esc(r.name) + '</h2>'
      + '<p class="about-text clamped" id="aboutText">' + K.esc(text) + '</p>'
      + '<button type="button" class="kf-more" id="aboutMore" aria-expanded="false">Vis mere <span aria-hidden="true">⌄</span></button>'
      + '<p class="text-xs faint mt-2">Beskrivelsen kommer fra kilden på engelsk.</p>'
    + '</div>';
  }

  // ── Information ────────────────────────────────────────────────────────
  function infoBlock(r) {
    const rows = [];
    const add = (label, value, hint) => { if (value) rows.push({ label, value, hint }); };
    add('Ticker', K.esc(r.symbol), 'Selskabets kode på børsen. Den du handler på.');
    add('Børs', K.esc(r.exchange || ''), 'Den børs aktien er noteret på.');
    add('Valuta', K.esc(r.currency || ''), 'Den valuta børsen handler aktien i.');
    if (FUND) {
      add('Direktør', K.esc(FUND.ceo || ''), 'Selskabets administrerende direktør ifølge kilden.');
      add('Antal medarbejdere', FUND.employees ? K.fmtInt(FUND.employees) : '', 'Antal fuldtidsansatte ifølge selskabets seneste indberetning.');
      if (FUND.website) {
        const host = String(FUND.website).replace(/^https?:\/\//, '').replace(/\/$/, '');
        add('Hjemmeside', '<a class="link-accent" href="' + K.esc(FUND.website) + '" target="_blank" rel="noopener noreferrer">'
          + K.esc(host) + '</a>', 'Selskabets eget websted. Åbner i en ny fane.');
      }
      add('Industri', K.esc(FUND.industry || ''), 'Den snævre branche selskabet hører til, under sektoren.');
    }
    add('Sektor', K.esc(r.sector || ''), 'Selskabets sektor efter GICS-systemet.');
    if (rows.length < 2) return '';

    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-1">Information</h2>'
      + rows.map((x) => statRow(x.label, x.value, '', x.hint)).join('')
    + '</div>';
  }

  // ── Nøgletal ───────────────────────────────────────────────────────────
  // Four figures about today and the year, then everything else on request.
  // In the advanced view the whole set is open from the start — that view
  // exists precisely for the reader who wants it.
  function keyFiguresBlock(r) {
    const k = keyOf(r.symbol);
    const cur = ' ' + K.esc(r.currency);
    const price = (v) => (v == null ? null : K.fmtPrice(v) + cur);

    const always = [
      ['Dagens min.', price(r.low), 'Den laveste kurs aktien er handlet til i dag.'],
      ['Dagens maks.', price(r.high), 'Den højeste kurs aktien er handlet til i dag.'],
      ['52 uger min.', price(r.week52_low), 'Den laveste kurs det seneste år.'],
      ['52 uger maks.', price(r.week52_high), 'Den højeste kurs det seneste år.'],
    ];

    const revPerShare = k && k.revenue && k.shares ? k.revenue / k.shares : null;
    const ps = k && k.revenue && r.market_cap ? r.market_cap / k.revenue : null;
    const more = [
      ['Startkurs', price(r.open), 'Kursen ved dagens åbning.'],
      ['Slutkurs', price(r.previous_close), 'Kursen da børsen lukkede forrige handelsdag.'],
      ['Markedsværdi', r.market_cap == null ? null : K.fmtBig(r.market_cap) + cur,
        'Kursen gange antallet af aktier — hvad hele selskabet koster på børsen.'],
      ['Price-to-Earnings (P/E)', mult(K.peOf(r.price, k && k.eps_ttm)),
        'Kursen delt med indtjeningen pr. aktie de seneste fire kvartaler. Hvor mange års indtjening du betaler for én aktie.'],
      ['Price-to-book (P/B)', mult(k && k.pb),
        'Kursen delt med selskabets bogførte egenkapital pr. aktie.'],
      ['Price-to-Sales (P/S)', mult(ps),
        'Markedsværdien delt med omsætningen. Bruges når et selskab endnu ikke tjener penge.'],
      ['Overskudsgrad', k && k.profit_margin == null ? null : pct1(k && k.profit_margin),
        'Hvor stor en del af omsætningen der bliver til overskud efter alt er betalt.'],
      ['Resultat per aktie (EPS)', k && k.eps_ttm == null ? null : price(k && k.eps_ttm),
        'Overskuddet delt ud på hver aktie, de seneste fire kvartaler.'],
      ['Omsætning', k && k.revenue == null ? null : K.fmtBig(k.revenue) + cur,
        'Selskabets samlede salg de seneste fire kvartaler.'],
      ['Omsætning per aktie', revPerShare == null ? null : price(revPerShare),
        'Omsætningen delt ud på hver aktie.'],
      ['EBITDA', k && k.ebitda == null ? null : K.fmtBig(k.ebitda) + cur,
        'Indtjening før renter, skat og afskrivninger — driften alene, uden hvordan selskabet er finansieret.'],
      ['Volumen', r.volume == null ? null : K.fmtBig(r.volume),
        'Antal aktier handlet i dag — stykker, ikke beløb.'],
      ['Gns. volumen', r.average_volume == null ? null : K.fmtBig(r.average_volume),
        'Gennemsnittet af de daglige volumener, beregnet af os ud fra kurshistorikken.'],
    ];

    const cell = ([label, value, hint]) => value == null ? '' :
      '<div><div class="kf-v num">' + value + '</div>'
      + '<div class="kf-k"><span class="hint" tabindex="0" data-hint-title="' + K.esc(label)
      + '" data-hint="' + K.esc(hint) + '">' + K.esc(label) + '</span>'
      + '<span class="hint-i" aria-hidden="true">i</span></div></div>';

    // The advanced view opens the whole set: it exists for the reader who
    // wants every figure, and hiding them behind a second click there would be
    // one gate too many.
    const openAll = state.adv;
    const extra = more.map(cell).filter(Boolean);

    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-3">Nøgletal</h2>'
      + '<div class="kf-grid">' + always.map(cell).join('') + '</div>'
      + (extra.length
          ? '<div class="kf-grid mt-4" id="kfMore"' + (openAll ? '' : ' hidden') + '>' + extra.join('') + '</div>'
            + (openAll ? ''
              : '<div class="mt-2"><button type="button" class="kf-more" id="kfToggle" aria-expanded="false" aria-controls="kfMore">'
                + 'Vis mere <span aria-hidden="true">⌄</span></button></div>')
          : '')
    + '</div>';
  }

  // ── Udbytter ───────────────────────────────────────────────────────────
  // The source gives the next ex-date, the yield and the payout ratio, but no
  // history of what was paid year by year, so this says what it knows and
  // stops there rather than drawing a chart out of one number.
  function dividendBlock(r) {
    const k = keyOf(r.symbol);
    const yieldPct = k && k.div_yield != null ? k.div_yield : null;
    const ex = FUND && FUND.ex_dividend;
    const paid = FUND && FUND.dividend_date;
    const payout = FUND && FUND.payout_ratio;
    if (yieldPct == null && !ex && !paid && payout == null) return '';

    const num = (v, suffix) => v == null ? null
      : '<span class="num">' + v.toLocaleString('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (suffix || '') + '</span>';

    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-1">Udbytter</h2>'
      + (yieldPct != null ? statRow('Udbytteafkast', num(yieldPct, ' %'), '',
          'Det seneste års udbytte i forhold til kursen. Et selskab uden udbytte står med en streg.') : '')
      + (ex ? statRow('Sidste ex-dag', '<span class="num">' + K.fmtDate(ex) + '</span>', '',
          'Køber du aktien på eller efter denne dag, får du ikke det kommende udbytte.') : '')
      + (paid ? statRow('Udbetaling', '<span class="num">' + K.fmtDate(paid) + '</span>', '',
          'Dagen udbyttet forventes udbetalt.') : '')
      + (payout != null ? statRow('Udbytteandel', num(payout * 100, ' %'), '',
          'Hvor stor en del af overskuddet der betales ud som udbytte. Resten bliver i selskabet.') : '')
      + '<p class="text-xs faint mt-2">Kilden opgiver ikke, hvad der er udbetalt de foregående år.</p>'
    + '</div>';
  }

  // ── Analytikerskøn ─────────────────────────────────────────────────────
  // What the analysts covering the company have said, counted. It is their
  // view, not ours, and the page says so: no verdict of Coop Banks own is
  // computed anywhere on this site.
  function analystBlock(r) {
    const a = FUND && FUND.analysts;
    if (!a || !a.total) return '';
    const rows = [
      ['Stærkt køb', a.strong_buy], ['Køb', a.buy], ['Hold', a.hold],
      ['Sælg', a.sell], ['Stærkt sælg', a.strong_sell],
    ];
    const max = Math.max.apply(null, rows.map((x) => x[1]));

    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold">Analytikerskøn</h2>'
      + '<p class="text-xs muted mt-1">Baseret på ' + a.total + ' analytikere. Det er deres vurderinger, '
        + 'ikke Coop Banks — og de er ikke en anbefaling.</p>'
      + '<div class="mt-3">' + rows.map(([label, n]) => {
          const pct = Math.round((n / a.total) * 100);
          const w = max ? Math.round((n / max) * 100) : 0;
          return '<div class="an-row">'
            + '<span class="an-label">' + label + '</span>'
            + '<span class="an-track"><span class="an-bar" style="width:' + w + '%"></span></span>'
            + '<span class="an-pct num">' + pct + '%</span></div>';
        }).join('') + '</div>'
    + '</div>';
  }

  // ── Forventet kurs ─────────────────────────────────────────────────────
  function targetBlock(r) {
    const t = FUND && FUND.target_mean;
    if (!t || r.price == null) return '';
    const lo = (FUND.target_low != null ? FUND.target_low : Math.min(t, r.price));
    const hi = (FUND.target_high != null ? FUND.target_high : Math.max(t, r.price));
    const span = (hi - lo) || 1;
    const at = (v) => Math.max(2, Math.min(98, ((v - lo) / span) * 100));
    const diff = ((t - r.price) / r.price) * 100;
    const cur = ' ' + K.esc(r.currency);

    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold">Forventet kurs</h2>'
      + '<p class="text-xs muted mt-1">Gennemsnittet af ' + (FUND.target_analysts || 'analytikernes')
        + (FUND.target_analysts ? ' analytikeres' : '') + ' kursmål på 12 måneders sigt. Et gennemsnit er ikke en forudsigelse, '
        + 'og spredningen under stregen viser hvor uenige de er.</p>'
      + '<div class="tg-wrap"><div class="tg-line">'
        + '<span class="tg-cap tg-cap-down" style="left:' + at(r.price) + '%">Nuværende kurs<strong class="num">'
          + K.fmtPrice(r.price) + cur + '</strong></span>'
        + '<span class="tg-mark" style="left:' + at(r.price) + '%;background:var(--text-primary)"></span>'
        + '<span class="tg-cap tg-cap-up" style="left:' + at(t) + '%">Kursmål<strong class="num">'
          + K.fmtPrice(t) + cur + '</strong></span>'
        + '<span class="tg-mark" style="left:' + at(t) + '%;background:var(--accent)"></span>'
      + '</div>'
      + '<div class="tg-ends"><span class="num">Lavest ' + K.fmtPrice(lo) + '</span>'
        + '<span class="num">Højest ' + K.fmtPrice(hi) + '</span></div></div>'
      + statRow('Forskel', '<span class="num ' + K.dirClass(diff) + '">' + K.fmtPct(diff) + '</span>', '',
          'Hvor langt kursmålet ligger fra kursen i dag. Positivt betyder at analytikerne i gennemsnit venter en stigning.')
    + '</div>';
  }

  // ── Calendar ───────────────────────────────────────────────────────────
  function calendarBlock(r) {
    if (!FUND) return '';
    const items = [];
    const push = (date, title, note) => { if (date) items.push({ date, title, note }); };
    push(FUND.next_earnings, 'Regnskab', FUND.earnings_estimated ? 'Forventet dato' : 'Bekræftet dato');
    push(FUND.earnings_call, 'Seneste conference call', 'Afholdt');
    push(FUND.ex_dividend, 'Ex-udbytte', 'Køber du efter denne dag, får du ikke udbyttet');
    push(FUND.dividend_date, 'Udbetaling af udbytte', '');
    if (!items.length) return '';

    // Past dates last, so what is coming sits at the top.
    const today = new Date().toISOString().slice(0, 10);
    items.sort((a, b) => (a.date >= today ? 0 : 1) - (b.date >= today ? 0 : 1) || a.date.localeCompare(b.date));

    return '<div class="card rounded-2xl p-5">'
      + '<h2 class="text-sm font-bold mb-3">Næste begivenheder</h2>'
      + items.map((it) => {
          const d = daysUntil(it.date), future = it.date >= today;
          return '<div class="stat flex items-start gap-3 py-2" style="display:flex;gap:12px">'
            + '<div class="num text-xs font-bold" style="min-width:5.5rem;color:' + (future ? 'var(--text-primary)' : 'var(--text-muted)') + '">'
              + K.fmtDate(it.date) + '</div>'
            + '<div><div class="text-sm font-semibold">' + K.esc(it.title) + '</div>'
            + '<div class="text-xs faint">' + K.esc(it.note)
            + (future && d != null ? (it.note ? ' · ' : '') + (d === 0 ? 'i dag' : 'om ' + d + ' dage') : '')
            + '</div></div></div>';
        }).join('')
      + (FUND.eps_estimate != null
          ? '<p class="text-xs faint mt-3">Analytikerne venter ' + K.fmtPrice(FUND.eps_estimate) + ' '
            + K.esc(r.currency) + ' i indtjening pr. aktie i kvartalet.</p>' : '')
    + '</div>';
  }

  // ── Earnings surprises ─────────────────────────────────────────────────
  function surpriseBlock(r) {
    const h = FUND && FUND.eps_history ? FUND.eps_history.slice().reverse() : [];
    if (!h.length) return '';
    const beats = h.filter((q) => q.actual > q.estimate).length;

    return '<div class="card rounded-2xl p-5">'
      + '<h2 class="text-sm font-bold">Indtjening</h2>'
      + '<p class="text-xs muted mt-1" style="max-width:70ch">Ramte selskabet forventningerne? Analytikernes gennemsnitlige forventning til '
        + 'indtjening pr. aktie, holdt op mod hvad selskabet leverede.</p>'
      + '<div class="overflow-x-auto mt-3" style="overflow-x:auto"><table class="w-full text-sm border-collapse">'
      + '<thead><tr class="text-xs faint text-left"><th class="py-2 pr-3 font-semibold">Kvartal</th>'
        + '<th class="py-2 px-3 font-semibold text-right">Forventet</th>'
        + '<th class="py-2 px-3 font-semibold text-right">Faktisk</th>'
        + '<th class="py-2 pl-3 font-semibold text-right">Forskel</th></tr></thead><tbody>'
      + h.map((q) => '<tr class="border-t divider">'
          + '<td class="py-2 pr-3 num">' + K.fmtDate(q.quarter) + '</td>'
          + '<td class="py-2 px-3 num text-right muted">' + K.fmtPrice(q.estimate) + '</td>'
          + '<td class="py-2 px-3 num text-right font-semibold">' + K.fmtPrice(q.actual) + '</td>'
          + '<td class="py-2 pl-3 num text-right ' + K.dirClass(q.surprise_pct) + '">'
            + K.fmtPct(q.surprise_pct) + '</td></tr>').join('')
      + '</tbody></table></div>'
      + '<p class="text-sm mt-3">Slog forventningen i <strong>' + beats + ' af de seneste ' + h.length
        + ' kvartaler</strong>. <span class="text-xs faint">Kilden giver fire kvartaler, så længere tilbage kan vi ikke se.</span></p>'
    + '</div>';
  }

  // ── Performance against the benchmarks ─────────────────────────────────
  // A stock's own return says little without the market's. Both sides are
  // measured over the same calendar window, taken from each series' own dates,
  // so a holiday in one market cannot shift the comparison.
  function returnOver(series, fromDate) {
    if (!series || !series.dates.length) return null;
    let i = K.nearestIndex(series.dates, fromDate);
    if (i === -1) return null;                       // window starts after the data ends
    return K.moveBetween(series.closes, i);
  }

  function windows() {
    const now = new Date();
    const back = (fn) => { const d = new Date(now); fn(d); return d.toISOString().slice(0, 10); };
    return [
      { label: '1 uge',     from: back((d) => d.setDate(d.getDate() - 7)) },
      { label: '1 måned',   from: back((d) => d.setMonth(d.getMonth() - 1)) },
      { label: '3 måneder', from: back((d) => d.setMonth(d.getMonth() - 3)) },
      { label: 'År til dato', from: now.getFullYear() + '-01-01' },
      { label: '1 år',      from: back((d) => d.setFullYear(d.getFullYear() - 1)) },
      { label: '3 år',      from: back((d) => d.setFullYear(d.getFullYear() - 3)), long: true },
      { label: '5 år',      from: back((d) => d.setFullYear(d.getFullYear() - 5)), long: true },
    ];
  }

  // Which yardstick to hold this company against: its own index where it has
  // one, otherwise the market it trades in.
  function benchFor(r) {
    if (!BENCH) return null;
    // The company's own index where it has one, otherwise the index of the
    // market it trades in.
    const codes = (r.indices || []);
    const pick = codes.includes('NDX') ? 'NDX'
      : codes.includes('SP500') ? 'SP500'
      : K.marketOf(r.market).bench;
    return (pick && BENCH[pick]) ? { code: pick, ...BENCH[pick] } : null;
  }

  // The simple view keeps the four windows people actually ask about, and
  // drops the index columns: comparing to Nasdaq-100 is a second question.
  const SIMPLE_WINDOWS = ['1 måned', 'År til dato', '1 år', '3 år'];

  function performanceBlock(r) {
    if (!full || !full.dates.length) return '';
    const bench = state.adv ? benchFor(r) : null;
    // The daily file covers two years; anything longer is read off the monthly
    // series, which reaches back to the listing.
    const monthly = full.monthly && full.monthly.dates.length ? full.monthly : null;
    const rows = windows().filter((w) => state.adv || SIMPLE_WINDOWS.includes(w.label)).map((w) => {
      const own = w.long
        ? (monthly ? returnOver(monthly, w.from) : null)
        : returnOver(full, w.from);
      const idx = w.long ? null : (bench ? returnOver(bench, w.from) : null);
      return { label: w.label, own, idx, diff: (own != null && idx != null) ? own - idx : null };
    }).filter((x) => x.own != null || x.idx != null);
    if (!rows.length) return '';

    const cell = (v) => '<td class="py-2 px-3 num text-right ' + K.dirClass(v) + '">' + K.fmtPct(v) + '</td>';
    return '<div class="card rounded-2xl p-5 mb-5">'
      + '<h2 class="text-sm font-bold">' + (bench ? 'Udvikling mod markedet' : 'Sådan er det gået') + '</h2>'
      + '<p class="text-xs muted mt-1" style="max-width:74ch">'
        + (bench
            ? 'Samme kalenderperiode for begge. Sammenligningen er med ' + K.esc(bench.label) + '. '
              + 'De to længste perioder er målt på månedlige lukkekurser, hvor de øvrige bruger daglige — '
              + 'indekset rækker kun to år tilbage, så der står ingen sammenligning for 3 og 5 år.'
            : 'Kursændring over hver periode. Udbytte er ikke regnet med.')
      + '</p>'
      + '<div class="overflow-x-auto mt-3" style="overflow-x:auto"><table class="w-full text-sm border-collapse">'
      + '<thead><tr class="text-xs faint text-left"><th class="py-2 pr-3 font-semibold">Periode</th>'
        + '<th class="py-2 px-3 font-semibold text-right">' + K.esc(r.symbol) + '</th>'
        + (bench ? '<th class="py-2 px-3 font-semibold text-right">' + K.esc(bench.label) + '</th>'
          + '<th class="py-2 px-3 font-semibold text-right">Forskel</th>' : '')
      + '</tr></thead><tbody>'
      + rows.map((x) => '<tr class="border-t divider"><td class="py-2 pr-3">' + K.esc(x.label) + '</td>'
          + cell(x.own)
          + (bench ? cell(x.idx) + '<td class="py-2 px-3 num text-right font-semibold '
              + K.dirClass(x.diff) + '">' + K.fmtPct(x.diff) + '</td>' : '')
        + '</tr>').join('')
      + '</tbody></table></div></div>';
  }

  // ── What 10.000 kr would have become ───────────────────────────────────
  function investedBlock(r) {
    const monthly = full && full.monthly && full.monthly.dates.length ? full.monthly : null;
    if (!monthly) return '';
    const AMOUNT = 10000;
    const now = new Date();
    const back = (y) => { const d = new Date(now); d.setFullYear(d.getFullYear() - y); return d.toISOString().slice(0, 10); };

    const at = (fromDate, label) => {
      // Daily closes where they reach, monthly beyond. Otherwise "1 år" here
      // would be measured off a month end while the table above measures it off
      // the day itself, and the same window would print two different returns.
      const daily = full && full.dates.length && fromDate >= full.dates[0];
      const src = daily ? full : monthly;
      const i = K.nearestIndex(src.dates, fromDate);
      if (i === -1) return null;
      const base = src.closes[i];
      if (!base || r.price == null) return null;
      // Latest price rather than the series' last close: today is not over.
      return { label, date: src.dates[i], value: AMOUNT * (r.price / base) };
    };

    const items = [at(back(1), 'For 1 år siden'), at(back(5), 'For 5 år siden'), at(back(10), 'For 10 år siden'),
      at(monthly.dates[0], 'Ved første kurs')].filter(Boolean);
    // "Ved første kurs" repeats the ten-year card for a company listed since.
    const seen = new Set();
    const uniq = items.filter((x) => (seen.has(x.date) ? false : seen.add(x.date)));
    if (!uniq.length) return '';

    return '<div class="card rounded-2xl p-5 mt-5">'
      + '<h2 class="text-sm font-bold">Hvis du havde investeret 10.000 kr.</h2>'
      + '<p class="text-xs muted mt-1" style="max-width:74ch">Beløbet ved dagens kurs, hvis du havde købt på '
        + 'månedens lukkekurs og ikke rørt det siden. Uden skat, omkostninger og udbytte — og uden '
        + 'valutaudsving, som for de amerikanske selskaber ville ændre resultatet i kroner.</p>'
      + '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4 mt-3">'
      + uniq.map((x) => {
          const gain = (x.value - AMOUNT) / AMOUNT * 100;
          return '<div class="card rounded-xl p-4">'
            + '<div class="text-[11px] font-bold uppercase faint" style="letter-spacing:.04em">' + K.esc(x.label) + '</div>'
            + '<div class="text-2xl font-extrabold num mt-1 ' + K.dirClass(gain) + '">'
              + K.fmtInt(Math.round(x.value)) + ' kr.</div>'
            + '<div class="text-xs faint num mt-1">' + K.fmtPct(gain) + ' · fra ' + K.fmtDate(x.date) + '</div>'
          + '</div>';
        }).join('')
      + '</div></div>';
  }

  // ── Similar companies ──────────────────────────────────────────────────
  // Peers are not handed to us by any source, so they are derived: the same
  // sector, ranked by how close they sit in market value. That is a stated rule
  // the reader can check, not an editorial pick.
  function peersBlock(r) {
    if (!ALL.length || !r.sector || r.market_cap == null) return '';
    const peers = ALL
      .filter((x) => x.symbol !== r.symbol && x.sector === r.sector && x.market_cap != null)
      .map((x) => ({ x, gap: Math.abs(Math.log(x.market_cap_dkk || 1) - Math.log(r.market_cap_dkk || 1)) }))
      .sort((a, b) => a.gap - b.gap)
      .slice(0, 5)
      .map((p) => p.x);
    if (!peers.length) return '';

    const line = (x, self) => {
      const k = keyOf(x.symbol);
      return '<tr class="border-t divider"' + (self ? ' style="background:var(--page-plane)"' : '') + '>'
        + '<td class="py-2 pr-3">' + (self
            ? '<span class="font-bold">' + K.esc(x.name) + '</span> <span class="text-xs faint">(denne)</span>'
            : '<a class="link-accent font-semibold" href="' + K.stockUrl(x.symbol) + '">' + K.esc(x.name) + '</a>')
          + '<div class="text-xs faint">' + K.esc(x.symbol) + '</div></td>'
        + '<td class="py-2 px-3 num text-right">' + (x.market_cap == null ? '–'
            : K.fmtBig(x.market_cap) + ' <span class="text-xs faint">' + K.esc(x.currency) + '</span>') + '</td>'
        + '<td class="py-2 px-3 num text-right">' + (k ? (mult(K.peOf(x.price, k.eps_ttm)) || '–') : '–') + '</td>'
        + '<td class="py-2 px-3 num text-right">' + (k ? (mult(K.peOf(x.price, k.eps_fwd)) || '–') : '–') + '</td>'
        + '<td class="py-2 px-3 num text-right">' + (k && k.revenue_growth != null ? pct1(k.revenue_growth) : '–') + '</td>'
        + '<td class="py-2 pl-3 num text-right ' + K.dirClass(x.change_1y) + '">' + K.fmtPct(x.change_1y) + '</td>'
      + '</tr>';
    };

    const symbols = [r.symbol].concat(peers.map((p) => p.symbol));
    return '<div class="card rounded-2xl p-5 mt-5">'
      + '<div class="flex items-baseline justify-between gap-3 flex-wrap" style="display:flex;justify-content:space-between">'
        + '<h2 class="text-sm font-bold">Lignende selskaber</h2>'
        + '<a class="link-accent text-xs font-semibold" href="sammenlign.html?symbols='
          + encodeURIComponent(symbols.join(',')) + '">Sammenlign selskaber →</a>'
      + '</div>'
      + '<p class="text-xs muted mt-1" style="max-width:74ch">De selskaber på listen der ligger i samme sektor og '
        + 'tættest på i markedsværdi. Det er en regel, ikke en vurdering — de er ikke nødvendigvis konkurrenter.</p>'
      + '<div class="overflow-x-auto mt-3" style="overflow-x:auto"><table class="w-full text-sm border-collapse">'
      + '<thead><tr class="text-xs faint text-left"><th class="py-2 pr-3 font-semibold">Selskab</th>'
        + '<th class="py-2 px-3 font-semibold text-right">Markedsværdi</th>'
        + '<th class="py-2 px-3 font-semibold text-right">P/E</th>'
        + '<th class="py-2 px-3 font-semibold text-right">Forward P/E</th>'
        + '<th class="py-2 px-3 font-semibold text-right">Omsætningsvækst</th>'
        + '<th class="py-2 pl-3 font-semibold text-right">1 år</th></tr></thead><tbody>'
      + line(r, true) + peers.map((p) => line(p, false)).join('')
      + '</tbody></table></div></div>';
  }

  // ── Ownership ──────────────────────────────────────────────────────────
  function ownershipBlock(r) {
    const k = keyOf(r.symbol);
    const inst = k ? k.inst_pct : null, ins = k ? k.ins_pct : null;
    const trades = FUND && FUND.insiders ? FUND.insiders : [];
    // Grants, gifts and option exercises are pay, not a decision to trade.
    const decided = trades.filter((t) => t.kind === 'buy' || t.kind === 'sell');
    if (inst == null && ins == null && !decided.length) return '';

    const bar = (label, v, hint) => v == null ? ''
      : '<div class="mb-3"><div class="flex items-baseline justify-between gap-3 text-sm" style="display:flex;justify-content:space-between">'
        + '<span class="hint" tabindex="0" data-hint-title="' + K.esc(label) + '" data-hint="' + K.esc(hint) + '">'
        + K.esc(label) + '</span><span class="num font-semibold">' + (v * 100).toFixed(1).replace('.', ',') + '%</span></div>'
        + '<div style="height:6px;border-radius:3px;background:var(--gridline);margin-top:5px;overflow:hidden">'
        + '<div style="height:100%;width:' + Math.min(100, v * 100).toFixed(1) + '%;background:var(--accent)"></div></div></div>';

    return '<div class="card rounded-2xl p-5 mt-5">'
      + '<h2 class="text-sm font-bold mb-3">Hvem ejer selskabet</h2>'
      + bar('Institutioner ejer', inst,
          'Fonde, pensionskasser og andre professionelle investorer tilsammen'
          + (FUND && FUND.inst_count ? ' — ' + K.fmtInt(FUND.inst_count) + ' forskellige institutioner.' : '.'))
      + bar('Insidere ejer', ins,
          'Ledelse og bestyrelse. En høj andel betyder at de selv har penge i selskabet.')
      + (decided.length
          ? '<h3 class="text-xs font-bold uppercase faint mt-4 mb-2" style="letter-spacing:.04em">Seneste insiderhandler</h3>'
            + '<p class="text-xs faint mb-2">Kun handler i markedet. Tildelte aktier, gaver og udnyttede optioner '
              + 'er løn og siger ikke det samme som et køb for egne penge.</p>'
            + decided.slice(0, 6).map((t) => '<div class="stat flex items-baseline justify-between gap-3 py-2" '
              + 'style="display:flex;justify-content:space-between;gap:12px">'
              + '<span class="text-sm"><span class="font-semibold">' + K.esc(t.role || '–') + '</span>'
              + '<span class="text-xs faint"> · ' + K.fmtDate(t.date) + '</span></span>'
              + '<span class="text-sm num ' + (t.kind === 'buy' ? 'up' : 'down') + '">'
              + (t.kind === 'buy' ? 'Købte' : 'Solgte')
              + (t.value ? ' ' + K.fmtBig(t.value) + ' ' + K.esc(r.currency) : '') + '</span></div>').join('')
          : (trades.length
              ? '<p class="text-xs faint mt-3">Ingen køb eller salg i markedet blandt de seneste registrerede '
                + 'handler — de er tildelinger, gaver eller optioner.</p>' : ''))
    + '</div>';
  }

  // ── Drawdown ───────────────────────────────────────────────────────────
  // The chart a price chart cannot be. Zero is a record high; everything below
  // is how far under the previous peak the stock has traded, month by month.
  function drawdownBlock(r) {
    const m = full && full.monthly && full.monthly.dates.length > 12 ? full.monthly : null;
    if (!m) return '';
    const dd = K.drawdownSeries(m.dates, m.closes);
    const lo = Math.min.apply(null, dd.values);
    if (!Number.isFinite(lo) || lo > -1) return '';    // never meaningfully below a peak

    const W = 900, H = 220, L = 46, R = 12, T = 12, B = 24;
    const iw = W - L - R, ih = H - T - B;
    const floor = Math.floor(lo / 10) * 10;
    const x = (i) => L + (dd.values.length < 2 ? iw : (i / (dd.values.length - 1)) * iw);
    const y = (v) => T + (v / floor) * ih;             // 0 at top, floor at bottom

    const ticks = [];
    for (let v = 0; v >= floor; v -= Math.max(10, Math.round(-floor / 4 / 10) * 10)) ticks.push(v);

    const area = 'M ' + x(0) + ' ' + y(0).toFixed(1)
      + dd.values.map((v, i) => ' L ' + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('')
      + ' L ' + x(dd.values.length - 1).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';

    const worst = dd.values.indexOf(lo);
    const years = [...new Set(m.dates.map((d) => d.slice(0, 4)))];
    const step = Math.max(1, Math.ceil(years.length / 8));

    return '<div class="card rounded-2xl p-5 mt-5">'
      + '<h2 class="text-sm font-bold">Hvor langt under toppen har den ligget?</h2>'
      + '<p class="text-xs muted mt-1" style="max-width:74ch">Nul betyder ny rekord. Alt derunder er afstanden ned '
        + 'fra den højeste kurs indtil da — samme historie som kursgrafen, men set fra toppen. '
        + 'Målt på månedlige lukkekurser.</p>'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="220" role="img" '
        + 'aria-label="Afstand fra tidligere toppunkt, måned for måned">'
      + ticks.map((t) => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1)
          + '" stroke="var(--gridline)" stroke-width="1"/>'
          + '<text x="' + (L - 7) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" font-size="11" '
          + 'fill="var(--text-muted)">' + t + '%</text>').join('')
      + '<path d="' + area + '" fill="var(--delta-down)" opacity="0.26"/>'
      + '<path d="M ' + dd.values.map((v, i) => x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' L ')
        + '" fill="none" stroke="var(--delta-down)" stroke-width="2"/>'
      + years.filter((_, i) => i % step === 0).map((yr) => {
          const i = m.dates.findIndex((d) => d.slice(0, 4) === yr);
          return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" '
            + 'fill="var(--text-muted)">' + yr + '</text>';
        }).join('')
      + '</svg>'
      + '<p class="text-xs muted mt-1">Værst: <strong class="num" style="color:var(--text-primary)">'
        + K.fmtPct(lo) + '</strong> i ' + K.fmtDate(m.dates[worst])
        + ' · nu <strong class="num" style="color:var(--text-primary)">'
        + K.fmtPct(r.drawdown_pct != null ? r.drawdown_pct : dd.values[dd.values.length - 1]) + '</strong></p>'
    + '</div>';
  }

  // Nothing is removed from the page, so the simple view says what is waiting
  // rather than letting a reader assume this is all there is.
  function simpleFooter(r) {
    return '<div class="card rounded-2xl p-4 mt-5 text-xs muted" style="max-width:80ch">'
      + 'Vil du se selskabet målt mod sit indeks, hvad 10.000 kr. ville være blevet til, '
      + 'regnskabskalenderen, de største fald, ejerforhold og alt det vi har regnet ud af kurshistorikken? '
      + 'Sæt flueben i <strong style="color:var(--text-primary)">Avanceret visning</strong> '
      + 'øverst på siden — valget huskes.</div>';
  }

  function factsBlock(r) {
    const list = facts(r);
    if (!list.length) return '';
    return '<div class="mt-6">'
      + '<h2 class="text-lg font-extrabold tracking-tight mb-1">Vidste du at…</h2>'
      + '<p class="text-xs muted mb-3" style="max-width:70ch">Alle tal herunder er beregnet ud fra kurshistorikken. '
        + 'Det seneste år dækker de seneste 252 handelsdage; “nogensinde” går tilbage til første registrerede kurs.</p>'
      + '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">'
      + list.map((f) => '<div class="card rounded-xl p-4">'
          + '<div class="text-[11px] font-bold uppercase faint" style="letter-spacing:.04em">' + K.esc(f.label) + '</div>'
          + '<div class="text-2xl font-extrabold num mt-1 ' + f.cls + '">' + f.value + '</div>'
          + '<p class="text-xs muted mt-1 leading-snug">' + f.note + '</p></div>').join('')
      + '</div></div>';
  }

  // ── Render ─────────────────────────────────────────────────────────────
  let full = null, row = null, fxRate = null;

  function renderChartBlock() {
    // A new window means new indices; an old selection would point at the
    // wrong days.
    sel.a = sel.b = null; sel.dragging = false;
    const s = slice(full);
    const comparing = state.compare.length > 0;

    $('#chartHost').innerHTML = comparing
      ? drawCompareChart(s.dates, s.closes, row)
      : drawChart(s.dates, s.closes, row.currency);
    $('#selSummary').hidden = true;
    // Click-to-select belongs to the price view; in the comparison the y-axis
    // is a percentage shared by several series and a selection would be
    // ambiguous about which one it refers to.
    // The help line only exists in the advanced view.
    const help = $('#selHelp');
    if (help) help.hidden = comparing;
    if (!comparing) wireChart();

    const move = s.closes.length > 1 ? ((s.closes[s.closes.length - 1] - s.closes[0]) / s.closes[0]) * 100 : null;
    $('#chartSummary').innerHTML = s.dates.length
      ? K.fmtDate(s.dates[0]) + ' – ' + K.fmtDate(s.dates[s.dates.length - 1])
        + ' · ' + s.dates.length + ' handelsdage · '
        + '<span class="num font-bold ' + K.dirClass(move) + '">' + K.fmtPct(move) + '</span> i perioden'
        + (s.closes.length > 1
            ? '<br>' + peakLine(s.dates, s.closes, row.currency, 'Højeste i perioden')
            : '')
      : 'Ingen handelsdage i den valgte periode.';
  }

  function setRange(key) {
    state.range = key;
    document.querySelectorAll('[data-range]').forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.range === key)));
    renderChartBlock();
  }

  // ── Live kurs ──────────────────────────────────────────────────────────
  // The whole page is drawn from one row, and half a dozen figures on it are
  // derived from the price — the header, the stat rows, P/E, what ten thousand
  // kroner would have become. Redrawing is what keeps them agreeing with each
  // other; patching the headline number alone would leave the page arguing
  // with itself. A tick is skipped while the pointer is inside the chart, so a
  // refresh never pulls the crosshair out from under the reader.
  let live = null, pointerInChart = false;

  function beginLive(r) {
    if (live) return;
    document.addEventListener('pointerover', (e) => {
      pointerInChart = !!(e.target.closest && e.target.closest('.chart-wrap'));
    });

    live = K.startLive({
      interval: 60_000,
      symbols: () => [r.symbol],
      apply: (data) => {
        const q = data.q[r.symbol];
        if (!q || q.p == null || q.p === r.price || pointerInChart) return;
        if (r.price_dkk != null && r.price) r.price_dkk *= q.p / r.price;
        r.price = q.p;
        if (q.c != null) r.change = q.c;
        if (q.cp != null) r.percent_change = q.cp;
        if (lastArgs) render.apply(null, lastArgs);
      },
      status: (mode, data) => {
        const el = $('#status');
        if (!el) return;
        if (mode !== 'live') return;
        const d = data.q[r.symbol] ? data.q[r.symbol].d : null;
        el.textContent = 'Kilde: Yahoo Finance · kursen opdateres hvert minut, mens børsen handler'
          + (d ? ' (' + d + ' min. forsinket fra ' + (r.exchange || 'børsen') + ')' : '')
          + ' · nøgletal og historik hentes tre gange på hverdage';
      },
    });
  }

  let lastArgs = null;

  function render(r, hist, fx, updatedAt, neighbours) {
    lastArgs = [r, hist, fx, updatedAt, neighbours];
    row = r; full = hist; fxRate = fx;
    const cur = r.currency;
    const conv = cur !== 'DKK' && r.price_dkk != null;
    document.title = r.name + ' (' + r.symbol + ') – aktiekurs';

    const head = '<div class="flex items-start justify-between gap-4 flex-wrap mb-5">'
      + '<div><h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">' + K.esc(r.name) + '</h1>'
      + '<p class="text-sm mt-1 muted">' + K.esc(r.symbol) + ' · ' + K.esc(r.exchange || '–')
      + ' · ' + K.esc(cur) + ' · ' + K.flagOf(r.market) + ' ' + K.esc(K.marketOf(r.market).label) + '</p>'
      + '<div class="flex flex-wrap gap-1.5 mt-2">'
        + (r.sector ? '<span class="chip rounded-full px-2.5 py-0.5 text-[11px] font-semibold hint" tabindex="0"'
            + ' data-hint-title="Sektor" data-hint="Selskabets branche efter GICS-systemet.">' + K.esc(r.sector) + '</span>' : '')
        + (r.indices || []).map(function (i) {
            var label = K.indexLabel(i);
            var hint = { SP500: 'Indgår i S&P 500 — de 500 største amerikanske børsnoterede selskaber.',
                         NDX: 'Indgår i Nasdaq-100 — de 100 største ikke-finansielle selskaber på Nasdaq.',
                         'DK-LARGE': 'Blandt de største selskaber på Nasdaq København.' }[i] || '';
            return '<span class="chip rounded-full px-2.5 py-0.5 text-[11px] font-semibold hint" tabindex="0"'
              + ' data-hint-title="' + K.esc(label) + '" data-hint="' + K.esc(hint) + '">' + K.esc(label) + '</span>';
          }).join('')
      + '</div></div>'
      + '<div class="text-right"><div class="text-3xl font-extrabold num">' + K.fmtPrice(r.price) + '</div>'
      + '<div class="text-sm num font-semibold ' + K.dirClass(r.percent_change) + '">'
      + K.fmtDelta(r.change) + ' (' + K.fmtPct(r.percent_change) + ')</div>'
      + (conv ? '<div class="text-xs faint num mt-1">≈ ' + K.fmtPrice(r.price_dkk) + ' DKK</div>' : '')
      + (r.drawdown_pct != null
          ? '<div class="text-xs num mt-1 hint" tabindex="0" data-hint-title="Fra toppen nogensinde"'
            + ' data-hint="Hvor langt kursen ligger under den højeste kurs selskabet har haft, ' + K.fmtPrice(r.ath)
            + ' ' + K.esc(cur) + ' den ' + K.fmtDate(r.ath_date) + '.">'
            + (Math.abs(r.drawdown_pct) < 0.05 ? '<span class="up">På all-time high</span>'
               : '<span class="' + K.dirClass(r.drawdown_pct) + '">' + K.fmtPct(r.drawdown_pct) + '</span>'
                 + '<span class="faint"> fra toppen</span>')
            + '</div>'
          : '')
      + '</div></div>';

    // Three windows answer "how is it going"; the finer ones are for someone
    // studying the shape of the move.
    // Appens egne syv vinduer. "6 mdr." og "Alt" hører til den avancerede
    // visning, hvor hele perioderækken alligevel er fremme.
    const SIMPLE_RANGES = ['1d', '1u', '1m', '3m', 'ytd', '1y', '3y'];
    const buttons = PRESETS.filter((p) => state.adv || SIMPLE_RANGES.includes(p.key)).map((p) =>
      '<button class="range-btn" data-range="' + p.key + '" aria-pressed="' + (p.key === state.range) + '">'
      + p.label + '</button>').join('');

    const chartCard = '<div class="card rounded-2xl p-4 md:p-5 mb-5">'
      + '<div class="flex items-center justify-between gap-3 flex-wrap mb-3">'
        + '<h2 class="text-sm font-bold">Kursudvikling</h2>'
        + '<div class="flex items-center gap-1.5 flex-wrap" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">' + buttons
          + (state.adv ? '<span class="mx-1 faint text-xs" aria-hidden="true">|</span>' : '')
          + (!state.adv ? '' : '<label class="text-xs faint hint" tabindex="0" data-hint-title="Egen periode"'
          + ' data-hint="Vælg selv fra- og til-dato. Grafen viser kun handelsdage, så weekender og helligdage springes over.">Fra</label>'
          + '<input type="date" id="from" class="date-input num">'
          + '<label class="text-xs faint" for="to">Til</label>'
          + '<input type="date" id="to" class="date-input num">'
          + '<button id="clearRange" class="range-btn">Nulstil</button>')
        + '</div>'
      + '</div>'
      + (BENCH && state.adv ? '<div class="flex items-center gap-2 flex-wrap mb-3 text-xs" '
          + 'style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'
          + '<span class="faint font-bold">Sammenlign med</span>'
          + Object.keys(BENCH).map((code) => '<label class="cmp">'
              + '<input type="checkbox" data-bench="' + code + '"' + (state.compare.includes(code) ? ' checked' : '') + '>'
              + '<span>' + K.esc(BENCH[code].label) + '</span></label>').join('')
          + '<span class="faint" id="cmpNote"' + (state.compare.length ? '' : ' hidden')
          + '>Grafen viser udvikling i procent fra periodens start, så begge kan læses på samme akse.</span>'
        + '</div>' : '')
      + '<p id="chartSummary" class="text-xs muted mb-1"></p>'
      + (state.adv ? '<p id="selHelp" class="text-xs faint mb-3">Klik på grafen for at sætte et startpunkt, og klik igen for at '
        + 'se udviklingen frem til det andet punkt. Du kan også trække.</p>' : '')
      + '<div id="chartHost"></div>'
      + '<p id="selSummary" class="text-xs mt-3 muted" hidden></p></div>';

    // Dagens handel-kortet er droppet: Nøgletal-blokken viser de samme tal, og
    // to kort med dagens højeste ville modsige hinanden så snart et af dem
    // blev ændret.
    const _unusedLeft = '<div class="card rounded-2xl p-5">'
      + '<h2 class="text-sm font-bold mb-2">Dagens handel</h2>'
      + statRow('Seneste', K.fmtPrice(r.price) + ' ' + K.esc(cur), '',
          'Den senest registrerede kurs. Dataene er forsinkede og opdateres tre gange på hverdage.')
      + statRow('Ændring i dag', K.fmtDelta(r.change) + ' (' + K.fmtPct(r.percent_change) + ')', K.dirClass(r.percent_change),
          'Forskellen mellem seneste kurs og forrige handelsdags lukkekurs — i kroner og i procent.')
      + statRow('Forrige lukning', K.fmtPrice(r.previous_close), '',
          'Kursen da børsen lukkede den foregående handelsdag. Grundlaget for dagens ændring.')
      + statRow('Dagens højeste', K.fmtPrice(r.high), '', 'Den højeste kurs aktien er handlet til i dag.')
      + statRow('Dagens laveste', K.fmtPrice(r.low), '', 'Den laveste kurs aktien er handlet til i dag.')
      + statRow('Volumen', K.fmtBig(r.volume), '',
          'Antal aktier handlet i dag — altså stykker, ikke beløb. Høj volumen betyder livlig handel.')
      + statRow('Gns. volumen' + (r.average_volume_days ? ' (' + r.average_volume_days + ' dage)' : ''),
          K.fmtBig(r.average_volume), '',
          'Gennemsnittet af de daglige volumener. Beregnet af os ud fra kurshistorikken — kilden opgiver ikke selv et gennemsnit.')
      + '</div>';

    const right = '<div class="card rounded-2xl p-5">'
      + '<h2 class="text-sm font-bold mb-2">Interval og udvikling</h2>'
      // The bar carried no scale: a line with a dot on it says nothing on its
      // own. The two ends and the dot are now named on the page rather than
      // only in the rows underneath.
      + (r.week52pos == null ? '' : '<div class="my-3" style="max-width:280px">'
        + '<p class="text-xs faint mb-1">Kursen i dag mellem årets laveste og højeste</p>'
        + '<div class="flex items-center justify-between text-xs num muted mb-1"'
          + ' style="display:flex;justify-content:space-between">'
          + '<span>' + K.fmtPrice(r.week52_low) + '</span>'
          + '<span>' + K.fmtPrice(r.week52_high) + '</span>'
        + '</div>'
        + K.rangeBar(r, 280, 22)
        + '<p class="text-xs muted mt-2">Prikken er <strong class="num" style="color:var(--text-primary)">'
          + K.fmtPrice(r.price) + ' ' + K.esc(cur) + '</strong> — '
          + Math.round(r.week52pos * 100) + '% oppe i intervallet.</p>'
      + '</div>')
      + statRow('52 ugers laveste', K.fmtPrice(r.week52_low), '', 'Den laveste kurs aktien har været i det seneste år.')
      + statRow('52 ugers højeste', K.fmtPrice(r.week52_high), '', 'Den højeste kurs aktien har været i det seneste år.')
      + statRow('Placering i intervallet', r.week52pos == null ? '–' : Math.round(r.week52pos * 100) + '%', '',
          'Hvor kursen ligger mellem årets laveste (0%) og højeste (100%). Prikken på bjælken viser det samme.')
      + statRow('Udvikling 30 dage', K.fmtPct(r.change30d), K.dirClass(r.change30d),
          'Kursændring over de seneste 30 handelsdage.')
      + statRow('Udvikling 6 måneder', K.fmtPct(r.change_6m), K.dirClass(r.change_6m),
          'Kursændring over de seneste 126 handelsdage, cirka et halvt år.')
      + statRow('Udvikling 1 år', K.fmtPct(r.change_1y), K.dirClass(r.change_1y),
          'Kursændring over de seneste 252 handelsdage, cirka et børsår.')
      + (r.market_cap != null ? statRow('Markedsværdi',
          K.fmtBig(r.market_cap) + ' ' + K.esc(cur), '',
          'Kursen gange antallet af aktier, i selskabets egen valuta. Det er denne størrelse indeksene vægtes efter.') : '')
      + (r.rank_sp500 ? statRow('Plads i S&P 500', '#' + r.rank_sp500, '',
          'Placering blandt de 503 selskaber i S&P 500, målt på markedsværdi. Indekset vægter efter frit omsættelige aktier, så rækkefølgen er tæt på den officielle uden at være identisk.') : '')
      + (r.rank_ndx ? statRow('Plads i Nasdaq-100', '#' + r.rank_ndx, '',
          'Placering blandt selskaberne i Nasdaq-100, målt på markedsværdi.') : '')
      + (r.rank_dk ? statRow('Plads i København', '#' + r.rank_dk, '',
          'Placering blandt de danske selskaber på listen, målt på markedsværdi.') : '')
      + (r.drawdown_pct != null ? statRow('Fra toppen nogensinde', K.fmtPct(r.drawdown_pct), K.dirClass(r.drawdown_pct),
          'Hvor langt kursen ligger under sin højeste nogensinde, ' + K.fmtPrice(r.ath) + ' ' + K.esc(cur)
          + ' den ' + K.fmtDate(r.ath_date) + '. Baseret på lukkekurser.') : '')
      + (conv
          ? statRow('Kurs omregnet', '≈ ' + K.fmtPrice(r.price_dkk) + ' DKK', '',
              'Kursen ganget med ECB’s referencekurs. Et beregnet tal, ikke en noteret kurs — derfor ≈.')
            + '<p class="text-xs faint mt-2">Omregnet til ' + K.fmtPrice(fx ? fx.rate : null)
            + ' DKK pr. USD (ECB ' + K.esc(fx ? fx.date : '–') + ').</p>'
          : '')
      + '</div>';

    const nav = '<div class="flex items-center justify-between gap-3 mt-6 text-xs">'
      + (neighbours.prev ? '<a class="link-accent font-semibold" href="' + K.stockUrl(neighbours.prev.symbol) + '">← '
