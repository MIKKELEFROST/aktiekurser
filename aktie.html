          + K.esc(neighbours.prev.name) + '</a>' : '<span></span>')
      + (neighbours.next ? '<a class="link-accent font-semibold text-right" href="' + K.stockUrl(neighbours.next.symbol) + '">'
          + K.esc(neighbours.next.name) + ' →</a>' : '<span></span>')
      + '</div>';

    const risk = '<p class="text-xs faint mt-6 leading-relaxed">'
      + 'Kurserne er vejledende og forsinkede markedsdata fra Yahoo Finance, hentet ' + K.fmtAge(updatedAt)
      + ', og udgør ikke investeringsrådgivning. Historiske afkast er ingen garanti for fremtidige afkast.</p>';

    // The simple page answers "how is it going": the price, the shape of the
    // move, how it compares to a few windows, and what an investment would have
    // become. Everything that values the company waits behind the switch.
    // The standard view is the app's own company page, block for block and in
    // its order: price and chart, what the company is, the figures, how it has
    // met expectations, what it pays out, what the analysts say, and what else
    // is like it. Nothing on it values the company on our behalf.
    const appPage = aboutBlock(r) + infoBlock(r) + keyFiguresBlock(r)
      + surpriseBlock(r) + dividendBlock(r) + analystBlock(r) + targetBlock(r)
      + peersBlock(r);

    // Everything this project can do that the app does not: the company
    // measured against its index, what an investment would have become, the
    // calendar, the falls, ownership, and the figures computed from the price
    // history itself.
    const ours = performanceBlock(r) + investedBlock(r)
      + '<div class="grid md:grid-cols-2 gap-5 items-start mb-5 mt-5">' + calendarBlock(r) + right + '</div>'
      + drawdownBlock(r)
      + ownershipBlock(r)
      + factsBlock(r);

    $('#content').innerHTML = head + overviewStrip(r) + chartCard
      + appPage
      + (state.adv ? ours : simpleFooter(r))
      + nav + risk;

    // The two "Vis mere" buttons open what is already rendered rather than
    // redrawing the page, so nothing else on screen moves and no scroll
    // position is lost.
    const kfBtn = $('#kfToggle'), kfBox = $('#kfMore');
    if (kfBtn && kfBox) kfBtn.addEventListener('click', () => {
      const opening = kfBox.hidden;
      kfBox.hidden = !opening;
      kfBtn.setAttribute('aria-expanded', String(opening));
      kfBtn.innerHTML = (opening ? 'Vis mindre' : 'Vis mere')
        + ' <span aria-hidden="true">' + (opening ? '⌃' : '⌄') + '</span>';
    });

    // The description is clamped rather than hidden, so it never collapses to
    // nothing — the button switches between four lines and all of them.
    const aboutBtn = $('#aboutMore'), aboutText = $('#aboutText');
    if (aboutBtn && aboutText) {
      // A description that fits inside four lines has nothing to expand.
      if (aboutText.scrollHeight <= aboutText.clientHeight + 2) aboutBtn.hidden = true;
      aboutBtn.addEventListener('click', () => {
        const open = aboutText.classList.toggle('clamped') === false;
        aboutBtn.setAttribute('aria-expanded', String(open));
        aboutBtn.innerHTML = (open ? 'Vis mindre' : 'Vis mere')
          + ' <span aria-hidden="true">' + (open ? '⌃' : '⌄') + '</span>';
      });
    }

    const advBox = $('#advToggle');
    if (advBox) advBox.addEventListener('change', (e) => {
      state.adv = e.target.checked;
      setAdv(state.adv);
      // The simple view offers fewer windows, so a range only it could reach
      // has to fall back rather than leave the chart on a hidden setting.
      const SIMPLE = ['1d', '1u', '1m', '3m', 'ytd', '1y', '3y'];
      if (!state.adv && !SIMPLE.includes(state.range)) { state.range = '1y'; state.from = state.to = ''; }
      if (!state.adv) state.compare = [];
      render.apply(null, lastArgs);
      const box = $('#advToggle');
      if (box) box.focus();
    });

    document.querySelectorAll('[data-range]').forEach((b) =>
      b.addEventListener('click', () => {
        const from = $('#from'), to = $('#to');
        if (from) from.value = '';
        if (to) to.value = '';
        setRange(b.dataset.range);
      }));

    document.querySelectorAll('[data-bench]').forEach((b) => b.addEventListener('change', () => {
      const code = b.dataset.bench;
      state.compare = b.checked
        ? state.compare.concat(code)
        : state.compare.filter((c) => c !== code);
      const note = $('#cmpNote');
      if (note) note.hidden = !state.compare.length;
      renderChartBlock();
    }));

    if ($('#from')) {
    const onDate = () => {
      state.from = $('#from').value; state.to = $('#to').value;
      if (state.from || state.to) {
        state.range = 'custom';
        document.querySelectorAll('[data-range]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
      }
      renderChartBlock();
    };
    $('#from').addEventListener('change', onDate);
    $('#to').addEventListener('change', onDate);
    $('#clearRange').addEventListener('click', () => { $('#from').value = ''; $('#to').value = ''; setRange('3m'); });
    }

    // Bound the pickers to the data we actually have, so an empty chart is
    // not reachable by picking a date outside the series.
    if (full && full.dates.length && $('#from')) {
      const lo = full.dates[0], hi = full.dates[full.dates.length - 1];
      ['#from', '#to'].forEach((sel) => { $(sel).min = lo; $(sel).max = hi; });
    }

    renderChartBlock();
  }

  function renderMissing(rows) {
    const list = rows.slice(0, 12).map((r) =>
      '<li><a class="link-accent" href="' + K.stockUrl(r.symbol) + '">' + K.esc(r.name) + '</a></li>').join('');
    $('#content').innerHTML = '<div class="card rounded-2xl p-6">'
      + '<h1 class="text-lg font-bold mb-2">Aktien blev ikke fundet</h1>'
      + '<p class="text-sm muted mb-4">'
      + (wanted ? 'Symbolet <code>' + K.esc(wanted) + '</code> er ikke i listen.' : 'Der er ikke angivet noget symbol.')
      + ' Prøv en af disse:</p><ul class="text-sm space-y-1 list-disc pl-5">' + list + '</ul>'
      + '<p class="mt-4 text-sm"><a class="link-accent font-semibold" href="markedskurser.html">Se alle aktiekurser →</a></p></div>';
  }

  (async () => {
    $('#status').textContent = 'Indlæser…';
    try {
      const list = await K.loadList();
      TOTAL = list.rows.length;
      const idx = list.rows.findIndex((r) => r.symbol.toUpperCase() === wanted);
      if (idx === -1) { renderMissing(list.rows); $('#status').textContent = ''; return; }

      const r = list.rows[idx];
      // History is a separate file, and the page is still useful without it,
      // so a failure there falls back to the 30-point sparkline series.
      let hist = null;
      try { hist = await K.loadHistory(r.symbol); }
      catch { hist = { dates: [], closes: r.spark || [] }; }
      if (!hist.dates.length && hist.closes.length) {
        hist.dates = hist.closes.map((_, i) => String(i));   // no dates: index axis
      }

      // Four more files, all optional. Each section checks its own data and
      // simply does not render if the fetch behind it failed, so one missing
      // file never takes the page down with it.
      // The row says whether a detail file was written for this company, so a
      // company without one is never asked for — 368 of them, each otherwise a
      // 404 in the console and a round trip for nothing. Rows from an older
      // build carry no flag, and are asked for as before.
      const wantsDetail = r.has_detail !== false;
      const [keys, funds, bench] = await Promise.all([
        K.loadKeyFigures().catch(() => null),
        wantsDetail ? K.loadFundamentals(r.symbol).catch(() => null) : Promise.resolve(null),
        K.loadBenchmarks().catch(() => null),
      ]);
      ALL = list.rows;
      KEYS = keys;
      FUND = funds;
      BENCH = bench && bench.indices ? bench.indices : null;

      render(r, hist, list.fx, list.updatedAt, {
        prev: idx > 0 ? list.rows[idx - 1] : null,
        next: idx < list.rows.length - 1 ? list.rows[idx + 1] : null,
      });
      $('#status').textContent = 'Kilde: Yahoo Finance · hentet ' + K.fmtAge(list.updatedAt)
        + ' · opdateres tre gange på hverdage';

      beginLive(r);
    } catch (err) {
      $('#content').innerHTML = '<div class="card rounded-2xl p-6 text-sm" style="color: var(--delta-down)">'
        + 'Kunne ikke indlæse data: ' + K.esc(err.message) + '</div>';
      $('#status').textContent = '';
    }
  })();
})();
</script>
</body>
</html>
