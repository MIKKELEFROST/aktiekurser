      + years.filter((_, i) => i % step === 0).map((yr) => {
          const i = m.dates.findIndex((d) => d.slice(0, 4) === yr);
          return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" '
            + 'fill="var(--text-muted)">' + yr + '</text>';
        }).join('')
      + '</svg>'
      + '<p class="text-xs muted mt-1">Værst: <strong class="num" style="color:var(--text-primary)">'
        + K.fmtPct(lo) + '</strong> i ' + K.fmtDate(m.dates[worst])
        + ' · nu <strong class="num" style="color:var(--text-primary)">' + K.fmtPct(nowDd) + '</strong></p>'
      + '</div>';
  }

  // ── Udsving ────────────────────────────────────────────────────────────
  // Kilden regner de her tal for de amerikanske fonde og næsten aldrig for de
  // europæiske. Blokken viser sig kun når der er noget at vise.
  function riskBlock(r) {
    const d = state.detail;
    const rows = (d && d.risk) ? d.risk.filter((x) => x.stddev != null) : [];
    if (!rows.length) return '';
    const label = { '3y': '3 år', '5y': '5 år', '10y': '10 år' };
    const num = (v, dec) => (v == null ? '–'
      : v.toLocaleString('da-DK', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
    return '<div class="card rounded-md p-5 mb-5">'
      + '<h2 class="text-sm font-bold">Udsving</h2>'
      + '<p class="text-xs muted mt-1" style="max-width:74ch">Hvor uroligt afkastet har været, målt af kilden. '
      + 'Standardafvigelsen er den vigtigste: den siger, hvor meget afkastet typisk har afveget fra sit eget '
      + 'gennemsnit på et år. Et højt tal er ikke i sig selv dårligt — det er prisen for et højere afkast.</p>'
      + '<div class="overflow-x-auto mt-3" style="overflow-x:auto"><table class="w-full text-sm border-collapse">'
      + '<thead><tr class="text-xs faint text-left"><th class="py-2 pr-3 font-semibold">Periode</th>'
      + '<th class="py-2 px-3 font-semibold text-right">Standardafvigelse</th>'
      + '<th class="py-2 px-3 font-semibold text-right">Beta</th>'
      + '<th class="py-2 px-3 font-semibold text-right">Sharpe</th>'
      + '<th class="py-2 pl-3 font-semibold text-right">Alfa</th></tr></thead><tbody>'
      + rows.map((x) => '<tr class="border-t divider">'
          + '<td class="py-2 pr-3">' + K.esc(label[x.y] || x.y) + '</td>'
          + '<td class="py-2 px-3 num text-right">' + num(x.stddev, 2) + '</td>'
          + '<td class="py-2 px-3 num text-right">' + num(x.beta, 2) + '</td>'
          + '<td class="py-2 px-3 num text-right">' + num(x.sharpe, 2) + '</td>'
          + '<td class="py-2 pl-3 num text-right">' + num(x.alpha, 2) + '</td></tr>').join('')
      + '</tbody></table></div>'
      + '<p class="text-xs faint mt-2">Beta 1,00 betyder at fonden svinger som markedet; over 1 svinger den '
      + 'mere. Sharpe er afkast pr. enhed risiko — jo højere, jo bedre betalt for udsvingene. '
      + 'Alfa er merafkastet ud over det, betaen alene forklarer.</p>'
      + '</div>';
  }

  // ── Vidste du at… ──────────────────────────────────────────────────────
  // Hvert tal her er regnet ud af kurshistorikken på siden, ikke hentet et
  // sted fra, så hvert kort siger hvad det er målt over.
  function facts(r) {
    const out = [];
    const card = (label, value, cls, note) => out.push({ label, value, cls: cls || '', note: note || '' });
    const day = dailySeries();
    const m = longSeries();
    const series = (m && m.dates.length > (day.dates.length / 12)) ? m : day;
    if (!series.dates.length) return out;

    // Højeste nogensinde og afstanden ned til i dag.
    let hi = 0;
    for (let i = 1; i < series.closes.length; i++) if (series.closes[i] > series.closes[hi]) hi = i;
    if (r.price != null && series.closes[hi]) {
      const from = ((r.price - series.closes[hi]) / series.closes[hi]) * 100;
      const flat = Math.abs(from) < 0.05 || from > 0;
      card('Fra toppen nogensinde', flat ? 'På toppen' : K.fmtPct(from), flat ? 'up' : K.dirClass(from),
        flat ? 'Kursen står i sit højeste niveau, siden vi begyndte at følge fonden.'
             : 'Højeste kurs var ' + K.fmtPrice(series.closes[hi]) + ' ' + K.esc(r.currency)
               + ' den ' + K.fmtDate(series.dates[hi]) + '.');
    }

    // Hvor længe har vi fulgt den.
    const first = r.first_date || series.dates[0];
    if (first) {
      const years = (Date.now() - new Date(first)) / (365.25 * 86400000);
      card('Kurser tilbage til', K.fmtDate(first), '',
        'Det er ' + years.toFixed(years < 10 ? 1 : 0).replace('.', ',') + ' år med kurser. '
        + (archive ? 'Hele historikken er hentet.' : 'De ældste er månedlige.'));
    }

    // Bedste og værste måned i den lange serie.
    if (m && m.closes.length > 13) {
      let best = 1, worst = 1;
      for (let i = 1; i < m.closes.length; i++) {
        const chg = (c, j) => (c[j - 1] ? (c[j] - c[j - 1]) / c[j - 1] : 0);
        if (chg(m.closes, i) > chg(m.closes, best)) best = i;
        if (chg(m.closes, i) < chg(m.closes, worst)) worst = i;
      }
      const pctAt = (i) => ((m.closes[i] - m.closes[i - 1]) / m.closes[i - 1]) * 100;
      card('Bedste måned', K.fmtPct(pctAt(best)), 'up',
        'Den blev afsluttet ' + K.fmtDate(m.dates[best]) + '.');
      card('Værste måned', K.fmtPct(pctAt(worst)), 'down',
        'Den blev afsluttet ' + K.fmtDate(m.dates[worst]) + '.');
    }

    // Hvor stor en del af dagene har været op.
    if (day.closes.length > 60) {
      let up = 0;
      for (let i = 1; i < day.closes.length; i++) if (day.closes[i] > day.closes[i - 1]) up++;
      const share = (up / (day.closes.length - 1)) * 100;
      card('Dage i plus', Math.round(share) + '%', '',
        'Af de ' + K.fmtInt(day.closes.length - 1) + ' handelsdage vi har daglige kurser for, '
        + 'lukkede ' + K.fmtInt(up) + ' højere end dagen før.');
    }

    // Hvad omkostningen koster over ti år på 100.000 kr.
    if (r.expense_ratio != null && r.expense_ratio > 0) {
      const kept = Math.pow(1 - r.expense_ratio / 100, 10);
      card('Omkostning over 10 år', K.fmtInt(Math.round(100000 * (1 - kept))) + ' kr.', '',
        'Af 100.000 kr. ville ' + feePct(r.expense_ratio) + ' om året tage så meget over ti år — '
        + 'før afkast. Regnet som en ren renters rente på gebyret.');
    }

    return out;
  }

  function factsBlock(r) {
    const list = facts(r);
    if (!list.length) return '';
    return '<div class="mt-5 mb-5">'
      + '<h2 class="text-lg font-extrabold tracking-tight mb-1">Vidste du at…</h2>'
      + '<p class="text-xs muted mb-3" style="max-width:70ch">Alle tal herunder er regnet ud af '
      + 'kurshistorikken på denne side.</p>'
      + '<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">'
      + list.map((f) => '<div class="card rounded-md p-4">'
          + '<div class="text-[11px] font-bold uppercase faint" style="letter-spacing:.04em">' + K.esc(f.label) + '</div>'
          + '<div class="text-2xl font-extrabold num mt-1 ' + f.cls + '">' + f.value + '</div>'
          + '<p class="text-xs muted mt-1 leading-snug">' + f.note + '</p></div>').join('')
      + '</div></div>';
  }

  // ── Andre fonde af samme slags ─────────────────────────────────────────
  function peersCard(r) {
    // Fonde i samme kategori, ellers fra samme udbyder, målt på formue. Det er
    // den sammenligning der er noget værd: samme slags kurv, andet mærke.
    const peers = ALL.filter((e) => e.symbol !== r.symbol
        && ((r.category && e.category === r.category) || (!r.category && e.family === r.family)))
      .sort((a, b) => (b.net_assets_dkk ?? -1) - (a.net_assets_dkk ?? -1))
      .slice(0, 6);
    if (!peers.length) return '';
    return '<div class="card rounded-md p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-1">Andre fonde af samme slags</h2>'
      + '<p class="text-xs faint mb-3">'
      +   (r.category ? 'Samme kategori — ' + K.esc(r.category) + '.' : 'Samme udbyder.')
      +   ' Sorteret efter formue.</p>'
      + '<div class="overflow-x-auto" style="overflow-x:auto"><table class="w-full text-sm border-collapse">'
      + '<thead><tr class="text-xs faint"><th class="text-left py-2 pr-3">Fond</th>'
      +   '<th class="text-right py-2 px-3">Omkostning</th><th class="text-right py-2 px-3">Formue</th>'
      +   '<th class="text-right py-2 pl-3">1 år</th></tr></thead><tbody>'
      + peers.map((e) => '<tr class="border-t divider">'
          + '<td class="py-2 pr-3"><a class="row-link" href="' + K.fundUrl(e.symbol) + '">'
          +   '<div class="font-semibold row-name">' + K.esc(e.name) + '</div>'
          +   '<div class="text-xs faint">' + K.flagOf(e.market) + ' ' + K.esc(e.symbol) + '</div></a></td>'
          + '<td class="py-2 px-3 text-right num">'
          +   (e.expense_ratio != null ? feePct(e.expense_ratio) : '–') + '</td>'
          + '<td class="py-2 px-3 text-right num">'
          +   (e.net_assets != null ? K.fmtBig(e.net_assets) + ' ' + K.esc(e.currency) : '–') + '</td>'
          + '<td class="py-2 pl-3 text-right num ' + K.dirClass(e.change_1y) + '">'
          +   K.fmtPct(e.change_1y) + '</td></tr>').join('')
      + '</tbody></table></div></div>';
  }

  // ── Om fonden ──────────────────────────────────────────────────────────
  function aboutCard(r) {
    const d = state.detail;
    const what = r.category
      ? 'Fonden hører i kategorien <strong style="color:var(--text-primary)">' + K.esc(r.category) + '</strong>.'
      : 'Kilden oplyser ikke en kategori for denne fond.';

    const topline = (d && d.holdings && d.holdings.length)
      ? ' De tre største poster er ' + d.holdings.slice(0, 3).map((h) => K.esc(h.n)).join(', ')
        + ' — se hele kurven under <strong style="color:var(--text-primary)">Beholdninger</strong>.'
      : '';

    return '<div class="card card-satin rounded-md p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-2">Hvad er det her?</h2>'
      + '<p class="about-text">'
      +   'En ETF er én post på din liste, der indeholder mange selskaber på én gang. '
      +   'Du køber en andel af hele kurven i stedet for at vælge selskaberne selv. ' + what
      +   (r.expense_ratio != null
          ? ' Den koster <strong style="color:var(--text-primary)">' + feePct(r.expense_ratio) + '</strong> om året i '
            + 'løbende omkostninger — det trækkes fra kursen løbende, ikke som en regning.'
          : ' Den løbende omkostning er ikke oplyst her; den står i fondens eget faktaark.')
      +   topline
      + '</p>'
      + (r.family
          ? '<p class="about-text mt-3">Bag fonden står <strong style="color:var(--text-primary)">'
            + K.esc(r.family) + '</strong>. Den handles på ' + K.esc(r.exchange || K.marketOf(r.market).exchange)
            + ' i ' + K.esc(r.currency) + ', så du køber og sælger i den valuta — kursen mod kronen '
            + 'flytter din værdi, uanset hvad fonden selv gør.</p>'
          : '')
      + '</div>'
      + distributionBlock(r);
  }

  // ── Information ────────────────────────────────────────────────────────
  function infoCard(r) {
    const d = state.detail;
    const rows = [];
    const add = (label, value, hint) => { if (value) rows.push({ label, value, hint }); };
    add('Ticker', K.esc(r.symbol), 'Fondens kode på børsen. Den du handler på.');
    add('Børs', K.esc(r.exchange || K.marketOf(r.market).exchange), 'Den børs fonden er noteret på.');
    add('Valuta', K.esc(r.currency || ''), 'Den valuta børsen handler fonden i.');
    add('Udbyder', K.esc(r.family || ''), 'Fondsselskabet bag. Vanguard, BlackRock (iShares) og Xtrackers '
      + 'står bag hovedparten af de europæiske UCITS-fonde.');
    add('Kategori', K.esc(r.category || ''), 'Kildens egen gruppering af, hvad fonden investerer i.');
    add('Type', K.esc((d && d.legal_type) || ''), 'Fondens juridiske form ifølge kilden.');
    add('Fonden oprettet', d && d.inception ? K.fmtDate(d.inception) : '',
      'Den dag fonden blev sat i verden ifølge kilden. Datoen passer ikke altid med den første kurs vi '
      + 'har: en fond der er noteret på flere børser, får ofte moderfondens kurser med tilbage.');
    add('Første kurs vi har', r.first_date ? K.fmtDate(r.first_date) : '',
      'Starten på den kurshistorik vi har hentet.');
    add('Formue i fonden', r.net_assets != null ? K.fmtBig(r.net_assets) + ' ' + K.esc(r.currency) : '',
      'Hvor mange penge der er investeret i fonden i alt.');
    add('Løbende omkostning', feePct(r.expense_ratio) || '',
      'Hvad fonden trækker om året for at drive sig selv.');
    add('Kursforsinkelse', r.delayed_by ? r.delayed_by + ' minutter' : '',
      'Hvor gammel den kurs er, børsen udleverer gratis.');
    if (rows.length < 2) return '';

    return '<div class="card rounded-md p-5 mb-5">'
      + '<h2 class="text-sm font-bold mb-1">Information</h2>'
      + rows.map((x) => statRow(x.label, x.value, '', x.hint)).join('')
      + '</div>';
  }

  // Intet fjernes fra siden, så den enkle visning siger hvad der venter i
  // stedet for at lade læseren tro, at det her er alt.
  function simpleFooter() {
    return '<div class="card rounded-md p-4 mb-5 text-xs muted" style="max-width:80ch">'
      + 'Vil du se fonden målt mod et indeks, hvad 10.000 kr. ville være blevet til, '
      + 'hvor langt under toppen den har ligget, udsvingene år for år og nøgletallene for '
      + 'selskaberne i kurven? Sæt flueben i <strong style="color:var(--text-primary)">Avanceret visning</strong> '
      + 'øverst på siden — valget huskes.</div>';
  }

  // ── Naboer på listen ───────────────────────────────────────────────────
  function neighbourNav(r) {
    const i = ALL.findIndex((e) => e.symbol === r.symbol);
    if (i === -1) return '';
    const prev = i > 0 ? ALL[i - 1] : null, next = i < ALL.length - 1 ? ALL[i + 1] : null;
    if (!prev && !next) return '';
    return '<div class="flex items-center justify-between gap-3 mt-6 text-xs" '
      + 'style="display:flex;justify-content:space-between">'
      // Symbolet skal med: en fond er ofte noteret flere steder med præcis
      // samme navn, og to identiske pile fortæller ikke hvor de fører hen.
      + (prev ? '<a class="link-accent font-semibold" href="' + K.fundUrl(prev.symbol) + '">← '
          + K.esc(prev.name) + ' <span class="faint">' + K.esc(prev.symbol) + '</span></a>'
        : '<span></span>')
      + (next ? '<a class="link-accent font-semibold text-right" href="' + K.fundUrl(next.symbol) + '">'
          + K.esc(next.name) + ' <span class="faint">' + K.esc(next.symbol) + '</span> →</a>'
        : '<span></span>')
      + '</div>';
  }

  // ── Tegn siden ─────────────────────────────────────────────────────────
  // Beskrivelsen, beholdningerne og stamoplysningerne er noget man slår op,
  // ikke noget man læser hver gang. De får hver sin fane, så tallene ikke skal
  // scrolles forbi — samme opdeling som aktiesiden.
  //
  // Alle faner tegnes; kun den valgte er synlig. Blev de bygget først ved
  // klik, skulle grafens og "Vis mere"-knappernes bindinger sættes op igen
  // hver gang, og grafen kan ikke måle sig selv i et skjult element.
  function render() {
    const r = state.row;
    if (!r) return;

    const oversigt = chartCard(r)
      + keyFiguresBlock(r)
      + rangeBlock(r)
      + annualBlock(r)
      + (state.adv
          ? performanceBlock(r) + investedBlock(r) + drawdownBlock(r) + riskBlock(r) + factsBlock(r)
          : performanceBlock(r) + simpleFooter())
      + peersCard(r);

    const PANES = [
      { key: 'oversigt', label: 'Oversigt', html: oversigt },
      { key: 'beholdninger', label: 'Beholdninger', html: holdingsBlock(r) },
      { key: 'om', label: 'Om fonden', html: aboutCard(r) },
      { key: 'info', label: 'Information', html: infoCard(r) },
    ].filter((p) => p.html);

    if (!PANES.some((p) => p.key === state.tab)) state.tab = PANES[0].key;

    const tabBar = PANES.length > 1
      ? '<div class="page-tabs" role="tablist" aria-label="Sider om fonden">'
        + PANES.map((p) => '<button type="button" class="page-tab" role="tab" data-tab="' + p.key + '"'
            + ' aria-selected="' + (p.key === state.tab) + '">' + K.esc(p.label) + '</button>').join('')
        + '</div>'
      : '';

    const risk = '<p class="text-xs faint mt-6 leading-relaxed">'
      + 'Tallene på siden er vejledende og hentet fra Yahoo Finance ' + K.fmtAge(UPDATED)
      + '. Vi rådgiver dig ikke her — det, der er sket før, siger ikke hvad der sker næste gang, '
      + 'og du kan risikere at få mindre tilbage, end du satte ind. Er du i tvivl, så ring til os.</p>';

    $('#page').innerHTML = header(r) + overviewStrip(r) + tabBar
      + PANES.map((p) => '<div class="page-pane" data-pane="' + p.key + '"'
          + (p.key === state.tab ? '' : ' hidden') + '>' + p.html + '</div>').join('')
      + neighbourNav(r) + risk;

    document.title = r.name + ' – ' + r.symbol + ' | Coop Bank Investering';
    updatePriceInfo();
    K.initHints();
    wireControls();
    renderChartBlock();
  }

  // Kun beholdningsfanen tegnes om for sig: den er den eneste der venter på
  // noget efter første tegning, nemlig listen over hvilke papirer vi selv har
  // en side om.
  function repaintHoldings() {
    const pane = document.querySelector('[data-pane="beholdninger"]');
    if (!pane || !state.row) return;
    pane.innerHTML = holdingsBlock(state.row);
    K.initHints();
  }

  function wireControls() {
    document.querySelectorAll('.page-tab').forEach((btn) => {
      btn.addEventListener('click', async () => {
        state.tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.page-tab').forEach((b) =>
          b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === state.tab)));
        document.querySelectorAll('.page-pane').forEach((pane) => {
          pane.hidden = pane.getAttribute('data-pane') !== state.tab;
        });
        // Søgeindekset hentes først når nogen faktisk åbner beholdningerne.
        if (state.tab === 'beholdninger' && known === null) {
          await ensureKnown();
          repaintHoldings();
        }
      });
    });

    // "Vis mere" åbner det der allerede er tegnet i stedet for at tegne siden
    // om, så intet andet på skærmen flytter sig og ingen rulleposition tabes.
    const kfBtn = $('#kfToggle'), kfBox = $('#kfMore');
    if (kfBtn && kfBox) kfBtn.addEventListener('click', () => {
      const opening = kfBox.hidden;
      kfBox.hidden = !opening;
      kfBtn.setAttribute('aria-expanded', String(opening));
      kfBtn.innerHTML = (opening ? 'Vis mindre' : 'Vis mere')
        + ' <span aria-hidden="true">' + (opening ? '⌃' : '⌄') + '</span>';
    });

    const advBox = $('#advToggle');
    if (advBox) advBox.addEventListener('change', (e) => {
      state.adv = e.target.checked;
      setAdv(state.adv);
      // Den enkle visning har færre vinduer, så en periode kun den avancerede
      // kunne nå, må falde tilbage frem for at lade grafen stå på en
      // indstilling der ikke er en knap for.
      if (!state.adv && !SIMPLE_RANGES.includes(state.range)) { state.range = '1y'; state.from = state.to = ''; }
      if (!state.adv) state.compare = [];
      render();
      const box = $('#advToggle');
      if (box) box.focus();
    });

    document.querySelectorAll('[data-range]').forEach((b) =>
      b.addEventListener('click', () => {
        const from = $('#from'), to = $('#to');
        if (from) from.value = '';
        if (to) to.value = '';
        state.from = state.to = '';
        setRange(b.dataset.range);
      }));

    document.querySelectorAll('[data-bench]').forEach((b) => b.addEventListener('change', () => {
      const code = b.dataset.bench;
      state.compare = b.checked ? state.compare.concat(code) : state.compare.filter((c) => c !== code);
      const note = $('#cmpNote');
      if (note) note.hidden = !state.compare.length;
      renderChartBlock();
    }));

    if ($('#from')) {
      const onDate = () => {
        state.from = $('#from').value; state.to = $('#to').value;
        if (state.from || state.to) {
          state.range = 'custom';
          document.querySelectorAll('[data-range]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
        }
        renderChartBlock();
      };
      $('#from').addEventListener('change', onDate);
      $('#to').addEventListener('change', onDate);
      $('#clearRange').addEventListener('click', () => {
        $('#from').value = ''; $('#to').value = ''; state.from = state.to = ''; setRange('3m');
      });

      // Datovælgerne bindes til de kurser vi faktisk har, så en tom graf ikke
      // kan nås ved at vælge en dato uden for serien.
      const m = longSeries(), day = dailySeries();
      const lo = (m && m.dates[0]) || day.dates[0];
      const hi = day.dates[day.dates.length - 1];
      if (lo && hi) ['#from', '#to'].forEach((s) => { $(s).min = lo; $(s).max = hi; });
      if (state.from) $('#from').value = state.from;
      if (state.to) $('#to').value = state.to;
    }
  }

  function notFound(all) {
    // Et symbol vi ikke kender skal ikke ende i en blank side. Vi viser de
    // største fonde, så man kan komme videre uden at gå tilbage først.
    const top = (all || []).slice(0, 12);
    $('#page').innerHTML = '<h1 class="text-2xl font-extrabold tracking-tight">Fonden blev ikke fundet</h1>'
      + '<p class="text-sm muted mt-2">'
      + (wanted ? 'Vi har ingen fond med symbolet <strong>' + K.esc(wanted) + '</strong>.'
                : 'Der er ikke angivet noget symbol.')
      + ' Prøv en af de største:</p>'
      + '<div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3 mt-4">'
      + top.map((e) => '<a class="card p-3 row-link" href="' + K.fundUrl(e.symbol) + '">'
          + '<div class="font-semibold text-sm row-name">' + K.esc(e.name) + '</div>'
          + '<div class="text-xs faint">' + K.flagOf(e.market) + ' ' + K.esc(e.symbol) + '</div></a>').join('')
      + '</div>'
      + '<p class="mt-5"><a href="etf.html" class="pill btn-outline">Se alle fonde</a></p>';
  }

  // ── Hent og start ──────────────────────────────────────────────────────
  async function loadFund() {
    const res = await fetch('data/etf.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('Kunne ikke hente fondslisten.');
    const data = await res.json();
    const etfs = data.etfs || [];
    return { row: etfs.find((e) => String(e.symbol).toUpperCase() === wanted),
             updatedAt: data.updated_at, all: etfs };
  }

  // Historikken ligger som én fil pr. fond. Mangler den, kan siden stadig
  // stå — den viser bare nøgletallene og siger hvorfor grafen ikke er der.
  async function loadHist(symbol) {
    try {
      const res = await fetch('data/etf-historik/' + encodeURIComponent(symbol) + '.json', { cache: 'no-cache' });
      if (!res.ok) return null;
      const h = await res.json();
      return (h && h.dates && h.dates.length >= 2) ? h : null;
    } catch { return null; }
  }

  (async () => {
    $('#status').textContent = 'Indlæser…';
    try {
      const { row, updatedAt, all } = await loadFund();
      ALL = all; UPDATED = updatedAt;
      if (!row) { $('#status').textContent = ''; return notFound(all); }
      state.row = row;

      // Tre filer mere, alle valgfri. Hver blok tjekker sine egne data og
      // tegner sig simpelthen ikke, hvis hentningen bag den slog fejl, så en
      // manglende fil aldrig tager siden med sig ned. Rækken siger selv, om
      // der er skrevet en detaljefil for fonden — 68 af dem har ingen, og
      // hver af dem ville ellers koste en 404 og en rundtur for ingenting.
      const [hist, detail, bench] = await Promise.all([
        loadHist(row.symbol),
        row.has_detail === false ? Promise.resolve(null) : K.loadFundDetail(row.symbol).catch(() => null),
        K.loadBenchmarks().catch(() => null),
      ]);
      state.hist = hist;
      state.detail = detail;
      BENCH = bench && bench.indices ? bench.indices : null;

      render();
      $('#status').textContent = 'Kilde: Yahoo Finance · hentet ' + K.fmtAge(updatedAt)
        + ' · kursen opdateres hvert minut, mens børsen handler';

      live = K.startLive({
        interval: 60_000,
        symbols: () => [row.symbol],
        apply: (data) => {
          const q = data.q[row.symbol];
          if (!q || q.p == null || q.p === row.price || pointerInChart) return;
          if (row.price_dkk != null && row.price) row.price_dkk *= q.p / row.price;
          row.price = q.p;
          if (q.c != null) row.change = q.c;
          if (q.cp != null) row.percent_change = q.cp;
          if (q.t != null) row.quote_time = q.t;
          if (q.d != null) row.delayed_by = q.d;
          // Kun tallene i toppen skiftes ud. At tegne hele siden om ville rive
          // grafen væk under markøren og lukke den fane læseren står på.
          const px = $('#px'), mv = $('#pxmove'), dkk = $('#pxdkk');
          if (px) px.textContent = K.fmtPrice(row.price);
          if (mv) {
            mv.textContent = K.fmtDelta(row.change) + ' (' + K.fmtPct(row.percent_change) + ')';
            mv.className = 'text-base font-bold num ' + K.dirClass(row.percent_change);
          }
          if (dkk && row.price_dkk != null) dkk.textContent = '≈ ' + K.fmtPrice(row.price_dkk) + ' DKK';
        },
        status: (mode, data) => {
          liveAt = mode === 'live' ? (data && data.t ? new Date(data.t).getTime() : Date.now()) : null;
          updatePriceInfo();
        },
      });
    } catch (err) {
      $('#page').innerHTML = '<p class="text-sm" style="color:var(--delta-down)">'
        + K.esc(err.message || 'Noget gik galt.') + '</p>'
        + '<p class="mt-4"><a href="etf.html" class="pill btn-outline">Se alle fonde</a></p>';
      $('#status').textContent = '';
    }
  })();
})();
</script>
</body>
</html>
